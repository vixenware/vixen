# The runner execution protocol. It came along in the standalone-workspace
# extraction as a verbatim copy of the facet-rs/facet crate and was never wired
# up; this is that crate adopted deliberately (#6). The types are vix-shaped —
# `SandboxCapability`, `ToolchainKind`, `RunnerCapabilities` — so they live
# here, while `vox`, the transport they ride, stays a facet thing.

[package]
name = "exec-protocol"
version = "0.1.0"
edition = "2024"
publish = false
description = "Public runner execution protocol types"

[package.metadata]

[package.metadata."docs.rs"]
rustdoc-args = ["--html-in-header", "arborium-header.html"]

[dependencies]
blake3.workspace = true
facet.workspace = true
vox.workspace = true

[lints]
workspace = true
