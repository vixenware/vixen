# DELIBERATELY MALFORMED, and cargo did not write it: this is
# `trees/dup-name-crate`'s generated lock with the root's two dependency entries
# collapsed back to the bare form. Cargo writes a dependency bare ONLY when the
# name is unique in the lock, so a bare `bitflags` here names two packages and
# the entry says nothing about which. Resolving it would have to guess; the
# walk raises `UnresolvableDependency` instead, and `cargo.vix` pins that.
version = 4

[[package]]
name = "bitflags"
version = "1.3.2"
source = "registry+https://github.com/rust-lang/crates.io-index"
checksum = "bef38d45163c2f1dde094a7dfd33ccf595c92905c8f8f4fdc18d06fb1037718a"

[[package]]
name = "bitflags"
version = "2.13.1"
source = "registry+https://github.com/rust-lang/crates.io-index"
checksum = "b588b76d00fde79687d7646a9b5bdf3cc0f655e0bbd080335a95d7e96f3587da"

[[package]]
name = "ambiguous-lock"
version = "0.1.0"
dependencies = [
 "bitflags",
]
