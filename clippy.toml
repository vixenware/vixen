  { path = "moire::locks::DiagnosticAsyncRwLock", reason = "async RwLocks cause deadlocks — use moire::Mutex instead" },
  { path = "moire_locks::DiagnosticAsyncMutex", reason = "async mutexes cause deadlocks — use moire::Mutex instead" },
  { path = "moire_locks::DiagnosticAsyncRwLock", reason = "async RwLocks cause deadlocks — use moire::Mutex instead" },
  { path = "moire::locks::DiagnosticRwLock", reason = "RwLocks are banned — use moire::Mutex instead" },
  { path = "moire_locks::DiagnosticRwLock", reason = "RwLocks are banned — use moire::Mutex instead" },
