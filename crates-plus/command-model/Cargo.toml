[package]
name = "command-model"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Describe a CLI tool's argument grammar; parse an argv into structure and reduce it to a canonical, content-addressable form."

[package.metadata]

[package.metadata."docs.rs"]
rustdoc-args = ["--html-in-header", "arborium-header.html"]

[dependencies]
# Types derive Facet so grammars are data, not code — no evaluator. The crate
# stays standalone; (de)serialization (facet-json) is only needed by tests.
facet = { workspace = true }

[dev-dependencies]
facet-json = { workspace = true }

[lints]
workspace = true
