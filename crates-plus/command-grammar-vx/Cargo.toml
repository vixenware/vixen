[package]
name = "command-grammar-vx"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Load command-model grammars authored in Vixen (.vx) via the Vixen parser — no evaluator."

[package.metadata]

[package.metadata."docs.rs"]
rustdoc-args = ["--html-in-header", "arborium-header.html"]

[dependencies]
# The engine, live from the working tree (we co-evolve it).
command-model = { path = "../command-model" }
# The parser, PINNED to a pushed commit over SSH so an in-flight refactor of
# vx-parser in this same checkout can't break our build. Bump deliberately.
# 007f1aa5 adds frontmatter, parens-optional import, and the @cc[…] CLI literal.
vx-parser = { git = "ssh://git@code.vixen.rs/vixen/vixen.git", rev = "007f1aa5906f1470906a598f6de5c5a52a426fd5" }

[dev-dependencies]
# Same pinned rev — cargo unifies to one instance, so test types match the lib's.
vx-parser = { git = "ssh://git@code.vixen.rs/vixen/vixen.git", rev = "007f1aa5906f1470906a598f6de5c5a52a426fd5" }

[lints]
workspace = true
