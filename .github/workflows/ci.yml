name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clippy:
    runs-on: depot-ubuntu-24.04-16
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo clippy --workspace --all-targets

  unit-tests:
    runs-on: depot-ubuntu-24.04-16
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@nextest

      - run: cargo nextest run --workspace --lib --bins

  integration-linux:
    runs-on: depot-ubuntu-24.04-32
    env:
      VX_KEEP_INTEGRATION_TMP: 1
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install FUSE
        run: sudo apt-get update && sudo apt-get install -y fuse3 libfuse3-dev

      - run: cargo run -p xtask -- integration run

      - name: Upload integration artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-linux-artifacts
          path: |
            /tmp/vxi
            /tmp/vxi-run
          if-no-files-found: ignore
  
  integration-windows:
    runs-on: [self-hosted, Windows, X64, eggs]
    env:
      VX_KEEP_INTEGRATION_TMP: 1
    steps:
      - uses: actions/checkout@v6

      - name: Prefer Git Bash over WSL bash
        shell: powershell
        run: |
          echo "C:\Program Files\Git\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: cargo run -p xtask -- integration run

      - name: Upload integration artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-windows-artifacts
          path: |
            ${{ runner.temp }}\vx-integration
            ${{ runner.temp }}\vx-integration-run
          if-no-files-found: ignore
