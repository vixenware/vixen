# Vixen Build roadmap.
#
# Each node is a unit of work: a title and a short description.
# `after:` lists the work that must come first — that's the sequencing.
#
# This is a STUB. The real work items and their order come from Amos.
# No sequencing is implied below (no `after:` edges yet).

title: Vixen Build — roadmap

nodes:
  - id: demand-runtime
    title: Demand-driven runtime
    description: The lazy evaluator that everything runs on.

  - id: exec
    title: exec
    description: Run a tool in a sandbox and get its output back.

  - id: cache-aws-sdk-s3
    title: Cache the aws-sdk-s3 build
    description: Replace its build scripts; cache the whole build.

  - id: remote-execution
    title: Remote build execution
    description: Place build steps on other machines.
