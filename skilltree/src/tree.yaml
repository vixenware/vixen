# Vixen Build — work map
#
# Purpose: show Mara (Hexcat) ALL the work there is to do to take Vixen Build to
# its full vision — the concrete roadmap behind the AWS conversation. This is a
# scope map, not funding/startup planning.
#
# Context: AWS (Celina + Jess) are cautiously interested in anything that makes
# their Rust builds faster. The plan is a concrete roadmap that delivers value
# early; there's a lot of groundwork; extra hands (Hexcat) could make it happen
# faster. This map is for seeing where those hands plug in.
#
# `hands: true`  -> flagged as a good candidate for extra hands (Hexcat):
#   well-scoped, parallelizable, doesn't require living inside Amos's head.
#   THE ✋ MARKS ARE AMOS'S BEST-GUESS PLACEHOLDERS — correct them, that's the
#   actual conversation with Mara.
#
# Status = Amos's read of reality:
#   done         shipped / solid
#   in_progress  actively being built right now (a lot is scaffolded)
#   planned      known, not started yet
#   idea         not started AND the approach is still open
#
# Reads left -> right: language/runtime -> exec + sandbox + VFS -> store &
# caching -> cargo-in-Vixen -> the value milestones (the demos that answer
# "is it even real") -> the full vision.

meta:
  title: Vixen Build — Work Map
  subtitle: All the work to reach the full vision. ✋ = good for extra hands (Hexcat). Drawn for the AWS roadmap conversation.

categories:
  foundation:
    label: Language & runtime
    color: "#5b8def"
  exec:
    label: Execution / sandbox / VFS
    color: "#ff7a45"
  cache:
    label: Store & caching
    color: "#e5544b"
  cargo:
    label: Cargo in Vixen
    color: "#c792ea"
  milestone:
    label: Value milestones
    color: "#ffd166"
  contrib:
    label: Parallel upstream work
    color: "#4cc9b0"

nodes:
  # ---------------------------------------------------- language & runtime
  - id: lang-frontend
    title: Language front-end
    status: in_progress
    category: foundation
    summary: Parser + IR + types — large and real, but still in flux.
    detail: >
      vx-parser (~8k loc) and vx-ir (~14k loc) plus types/diagnostics — a big, real
      front-end (build / type_collect / resolve / type_check / cap_check / capture).
      The language is still evolving, not frozen.
    payoff: A real typed language with a real front-end — this is why "is it even
      real" has a good answer.

  - id: demand-runtime
    title: Demand-driven runtime
    status: in_progress
    category: foundation
    summary: Lazy demand sea, eager kernel islands — no tree-walker (vx-runtime, ~7k loc).
    detail: >
      Values are node references; forcing is the only way a scalar appears; commands
      run on executors; everything is content-addressed. Mid-rebuild — the old eager
      evaluator is being removed. This is the core Amos must drive.
    payoff: Demand-driven evaluation is the bet that makes correct cache reuse across
      the graph possible at all — the thing sccache structurally cannot do.
    requires: [lang-frontend]

  - id: intrinsic-http
    title: HTTP fetch intrinsic
    status: planned
    category: foundation
    hands: true
    summary: Build-graph intrinsic for fetching crates / sources. vx-http exists.
    detail: >
      vx-http (~330 loc) exists as a fetch primitive; the work is exposing fetching
      as a proper build-graph intrinsic so the graph can acquire registry indexes,
      crate tarballs, and toolchains.
    payoff: No real Rust build without fetching dependencies — a hard prerequisite
      for doing cargo's job inside Vixen.
    requires: [demand-runtime]

  - id: intrinsic-deser
    title: JSON / YAML / TOML deserialize
    status: planned
    category: foundation
    hands: true
    summary: Read Cargo.toml, Cargo.lock, registry JSON. Greenfield (vx-stdlib ~45 loc).
    detail: >
      Structured deserialization intrinsics (facet-based) so the build can read
      manifests, lockfiles, and registry metadata as typed values.
    payoff: Cargo's whole input is TOML + registry JSON. Can't model a cargo build
      without parsing them into the graph.
    requires: [demand-runtime]

  - id: intrinsic-pubgrub
    title: Dependency resolution (pubgrub)
    status: planned
    category: foundation
    hands: true
    summary: Version solving over the dependency graph. Greenfield.
    detail: >
      A pubgrub-style resolver so Vixen can compute the same dependency graph cargo
      would, from manifests + lockfile.
    payoff: Getting the resolved graph exactly right is what makes a Vixen build of a
      real workspace match cargo's — and therefore trustworthy.
    requires: [demand-runtime, intrinsic-deser]

  - id: lsp
    title: LSP / editor support
    status: in_progress
    category: foundation
    hands: true
    summary: vx-lsp (~3.4k loc) — diagnostics and build feedback in the editor.
    detail: >
      Language-server support for editing .vx, surfacing diagnostics, and (later)
      build feedback. Real today, with room to grow as DX.
    payoff: A build system people author against needs good editor feedback — this
      is the difference between a tool people tolerate and one they like.
    requires: [lang-frontend]

  # ------------------------------------------------- execution / sandbox / VFS
  - id: vfs
    title: Virtual filesystem
    status: in_progress
    category: exec
    hands: true
    summary: Per-OS VFS for hermetic builds — FUSE (Linux), FSKit (macOS), projfs (Windows).
    detail: >
      A large subsystem — vx-vfsd (~4k loc), vx-fskit (~2.5k, macOS), vendored fuse3
      (Linux), and Windows projfs. Plus vx-management (~530 loc), the privileged
      macOS daemon for block-device mount + fskitd kill-switch.
    payoff: The VFS is how a sandboxed build sees only its declared inputs — the
      backbone of hermeticity and correct read-sets. Big, specialized, parallelizable.
    requires: [demand-runtime]

  - id: sandboxing
    title: Sandboxing
    status: in_progress
    category: exec
    hands: true
    summary: Confine each exec — landlock-exec (Linux) + macOS sandbox.
    detail: >
      landlock-exec (~200 loc) confines a process on Linux; macOS has its own path.
      A sandboxed process sees only the VFS-mounted inputs.
    payoff: Sandboxing is what makes a build step's inputs knowable and its outputs
      trustworthy — the other half of cache correctness.
    requires: [vfs]

  - id: exec
    title: exec — the build primitive
    status: in_progress
    category: exec
    summary: Run a tool in a sandbox; output crosses back as a tree. Actively building.
    detail: >
      The single build primitive, being done right now — ship a payload to an
      executor, run it sandboxed over the VFS, return only produced values. The core
      Amos must drive.
    payoff: One auditable primitive for every compiler step makes placement,
      sandboxing, and cache keys uniform instead of ad hoc.
    requires: [demand-runtime, sandboxing]

  - id: structured-commands
    title: Structured commands
    status: in_progress
    category: exec
    hands: true
    summary: Describe a tool's argv grammar; reduce it to a canonical, hashable form.
    detail: >
      command-model (~1.7k loc) + command-grammar-vx — describe a CLI tool's argument
      grammar and reduce an argv to a canonical, content-addressable form (grammars
      for cc, rustc authored in .vx).
    payoff: Canonical commands are what make two "equivalent" invocations share a
      cache key instead of missing — precision at the command layer.
    requires: [exec]

  - id: closure-shipping
    title: Closure shipping
    status: in_progress
    category: exec
    summary: Ship a computation to a remote executor.
    detail: >
      Serialize and ship a closure (the work to run) to an executor elsewhere, so
      the same build step can run off-machine.
    payoff: The mechanism behind remote build execution — move the work to where the
      capacity (or the toolchain) is.
    requires: [exec]

  - id: streams
    title: Streams
    status: in_progress
    category: exec
    summary: Stream command output as it is produced.
    detail: A command's output stream is a real value that crosses back as it runs.
    payoff: Live build output and pipelined consumption — not a black box that
      returns only when finished.
    requires: [exec]

  - id: remote-handles
    title: Remote handles
    status: in_progress
    category: exec
    summary: Values that are handles to remotely-produced trees.
    detail: >
      A produced tree can stay on the executor and cross back as a handle, pulled
      lazily over a virtual connection only when forced.
    payoff: Lets large artifacts live where they were built instead of being copied
      everywhere — essential for distributed builds to be fast.
    requires: [exec, closure-shipping]

  - id: control-plane
    title: Runners + control plane
    status: in_progress
    category: exec
    summary: Capability-advertising executor daemons; predicate placement (scaffolded).
    detail: >
      vx-daemon / vx-services / vx-runner scaffolding exists. Long-lived executor
      daemons detect what their host has installed and advertise it; the orchestrator
      places each exec by predicate. Must work fully local (LAN, no cloud).
    payoff: Turns CI + dev machines into one build fabric — and runs fully on-prem,
      which AWS will require.
    requires: [exec]

  - id: remote-execution
    title: Remote build execution
    status: planned
    category: exec
    summary: Run real build steps on remote executors.
    detail: >
      Closure shipping + remote handles + the control plane, composed — place build
      steps on other machines and pull results back lazily.
    payoff: A money shot AWS named directly. Spread a build across a fleet instead of
      hammering one workstation or one CI runner.
    requires: [remote-handles, control-plane]

  # ----------------------------------------------------------- store & caching
  - id: content-store
    title: Content store (CDC + blake3)
    status: in_progress
    category: cache
    summary: vx-store — content-defined chunking, blake3 merkle trees. Partial (~620 loc).
    detail: >
      vx-store does content-defined chunking and blake3 merkle trees today. Still
      missing — no references between tree objects, no lifecycle policies, no
      tiering/ownership.
    payoff: Content addressing is the foundation of "never rebuild what someone
      already built". The chunking + hashing half already works.
    requires: [demand-runtime]

  - id: tree-references
    title: References between tree objects
    status: planned
    category: cache
    hands: true
    summary: Let tree objects reference other tree objects. Not started.
    detail: vx-store has no concept of references between tree objects yet — needed for structured, deduplicated artifacts.
    payoff: Without references, the store can't represent the real shape of build
      outputs (a tree that points at other cached trees).
    requires: [content-store]

  - id: durable-fn-cache
    title: Durable function-invocation cache
    status: idea
    category: cache
    summary: Cache invocations durably — not just in-memory in an executor.
    detail: >
      A scheme to cache function invocations durably across runs and machines,
      rather than only as in-memory memo state inside one executor. The approach is
      still up in the air — core design Amos must drive.
    payoff: This is "caching in general" — the thing that makes a second build, on a
      second machine, nearly free. The core of the whole value proposition.
    requires: [content-store, exec]

  - id: coarse-fine-key
    title: Coarse / fine cache key
    status: idea
    category: cache
    summary: Reconcile workspace-level input hashes with what actually changed.
    detail: >
      The contradiction to solve. If the whole workspace changes, the coarse input
      hash changes — do we rerun? It depends. The previous cache key knows which
      keys actually changed; if those files are still the same, we skip the build.
    payoff: Solving this is what separates "fast when nothing changed" from "fast
      when one file in a huge workspace changed" — exactly AWS's daily case.
    requires: [durable-fn-cache]

  - id: lifecycle-policies
    title: Lifecycle policies
    status: planned
    category: cache
    hands: true
    summary: GC, retention, eviction for stored objects. Not started.
    detail: vx-store has no lifecycle policies yet — nothing decides what to keep, evict, or promote.
    payoff: A shared cache that never evicts grows without bound. Lifecycle is what
      makes an org-wide cache operable, not just a demo.
    requires: [content-store]

  - id: store-tiers
    title: Tiering & ownership
    status: planned
    category: cache
    hands: true
    summary: Local / shared / remote tiers, with ownership. Not started.
    detail: vx-store has no tiering or ownership yet — needed so artifacts live local-fast and shared-org-wide.
    payoff: Big artifacts need a storage hierarchy that's fast locally and shared
      across the org — the substrate for cross-machine reuse.
    requires: [content-store, tree-references]

  - id: on-prem
    title: On-prem deployment
    status: idea
    category: cache
    summary: Run the store + registry inside AWS infra. Not started.
    detail: >
      [CONFIRM exact AWS constraints] Self-hosted store/registry, no third-party
      cloud in the path. Vixen must be fully usable with no commercial cloud.
    payoff: AWS will not ship build artifacts to an outside cloud. On-prem is table
      stakes, not a later tier.
    requires: [store-tiers]

  # -------------------------------------------------------------- cargo in vixen
  - id: scope-aws-sdk-s3
    title: Scope aws-sdk-s3 (map the hard parts)
    status: planned
    category: cargo
    hands: true
    summary: Map aws-sdk-s3's dependency graph; find what's actually hard. Startable now.
    detail: >
      Compiling aws-sdk-s3 is the target. First map its dependency tree and identify
      what is genuinely hard (build scripts, native deps, proc macros) — startable
      now with cargo tree, before the runtime is ready. Ideal early Hexcat task.
    payoff: Turns "the whole aws-sdk" into a concrete, bounded target — and tells us
      exactly which de-risk concerns the demo will actually hit.

  - id: cargo-build-semantics
    title: Cargo-build semantics in Vixen
    status: planned
    category: cargo
    summary: Define what "build this cargo workspace" means in Vixen. Not started.
    detail: >
      Actually defining the semantics of a cargo build inside Vixen — profiles,
      features, units, the compile graph — driven by the resolved dependency graph.
      Core design Amos must drive.
    payoff: The bridge from "interesting language" to "builds the Rust code AWS
      actually has". Nothing about Rust matters to them until this exists.
    requires: [intrinsic-http, intrinsic-deser, intrinsic-pubgrub]

  - id: build-script-replacement
    title: Replace build.rs with a Vixen file
    status: planned
    category: cargo
    hands: true
    summary: Swap a crate's build script for a pure, cacheable Vixen build file.
    detail: >
      Replace a crate's build.rs with a Vixen build file — turning an opaque,
      side-effecting script into a pure, content-addressed, cacheable graph node.
      Per-crate work, parallelizable once the pattern exists.
    payoff: Build scripts are the wall sccache hits. Replacing them is precisely what
      lets the cache cover the parts of the graph it currently can't.
    requires: [cargo-build-semantics]

  - id: fixup-distribution
    title: Fixup distribution
    status: planned
    category: cargo
    hands: true
    summary: Author and distribute Vixen build-file replacements ("fixups") for crates.
    detail: >
      A way to author and distribute the Vixen build-file replacements for crates
      whose build scripts need fixing up — a shared, reusable set of fixups.
    payoff: One fixup, written once, makes every consumer of that crate cacheable.
      How the build-script win scales across a whole dependency tree.
    requires: [build-script-replacement]

  - id: proc-macros
    title: Proc-macro support
    status: planned
    category: cargo
    hands: true
    summary: Procedural macros compiled and cached correctly.
    detail: Celina's concern — proc macros are compiled host code inside the graph.
    payoff: Ubiquitous in AWS's Rust. A build system that can't handle them isn't a
      Rust build system.
    requires: [cargo-build-semantics]

  - id: native-deps
    title: Native dependencies
    status: planned
    category: cargo
    hands: true
    summary: C / system libraries, -sys crates, linkers, sysroots.
    detail: >
      Celina's concern — native deps drag in host toolchains and absolute paths.
      Ties to hermetic vs host-present toolchains and to build-script replacement.
    payoff: AWS's real graphs aren't pure Rust. Native deps are where naive build
      systems lose correctness — getting them right is a credibility proof.
    requires: [cargo-build-semantics]

  - id: private-registries
    title: Private registries
    status: planned
    category: cargo
    hands: true
    summary: Resolve and cache from internal / private crate registries.
    detail: Celina's concern — AWS uses private registries, not just crates.io.
    payoff: No enterprise build runs against crates.io alone. Must speak their registry.
    requires: [cargo-build-semantics, intrinsic-http]

  - id: platforms
    title: Linux + macOS + Windows
    status: planned
    category: cargo
    hands: true
    summary: Linux now, macOS present, Windows by next year. Per-OS VFS work.
    detail: >
      AWS — Linux is the main platform, macOS very present, Windows likely required
      next year. Each platform needs its VFS/sandbox path working end to end.
    payoff: Matches AWS's actual platform matrix. Windows on the roadmap shows we
      build for their reality, not just ours.
    requires: [cargo-build-semantics, vfs]

  # ----------------------------------------------------------- value milestones
  - id: cache-aws-sdk-s3
    title: Cache the aws-sdk-s3 build
    status: idea
    category: milestone
    summary: The Amazon money shot — fix the build scripts, cache the whole thing.
    detail: >
      Replace aws-sdk-s3's build scripts with Vixen build files and cache the entire
      build end to end. A giant, build-script-heavy crate Amazon knows intimately,
      suddenly cacheable.
    payoff: THE money shot for Amazon — undeniable, on a workload they own. A cold
      build that comes back nearly free is hard to argue with.
    requires: [scope-aws-sdk-s3, fixup-distribution, durable-fn-cache, coarse-fine-key]

  - id: remote-build-demo
    title: Remote build execution demo
    status: idea
    category: milestone
    summary: Build a real Rust workspace across a fleet of machines.
    detail: Drive a real cargo-shaped build with steps placed on remote executors.
    payoff: The second money shot AWS named — turn CI + idle dev machines into one
      build fabric, off the single-workstation critical path.
    requires: [remote-execution, cargo-build-semantics]

  - id: concrete-proof
    title: Concrete proof of value (early)
    status: idea
    category: milestone
    summary: The runnable "is it even real" deliverable Jess + Celina asked for.
    detail: >
      A reproducible artifact a skeptic can run — not slides — showing the speedup on
      aws-sdk-s3. [CONFIRM headline metric — cold/warm time, % graph hit, laptop-hits-CI]
    payoff: Deliver value early. This is what answers "is it even real" and "why will
      this succeed when Argon didn't" — concretely, not with promises.
    requires: [cache-aws-sdk-s3]

  - id: validated-at-scale
    title: Validated on AWS's real graphs
    status: idea
    category: milestone
    summary: Every kill-on-arrival concern cleared on AWS's actual workloads.
    detail: >
      The collaboration half — AWS feedback on whether it works at scale, across
      their real graphs and platforms, with each concern answered.
    payoff: The only way to know Vixen Build survives contact with a graph their
      size — and collaboration AWS values as much as money.
    requires: [concrete-proof, remote-build-demo, proc-macros, native-deps, private-registries, platforms, on-prem]

  - id: full-vision
    title: Vixen Build — full vision
    status: idea
    category: milestone
    summary: Demand-driven, distributed, correct-by-construction builds. The destination.
    detail: The end state of all the work on this map — Vixen Build, complete.
    payoff: The destination this whole map leads to — the build system the language,
      runtime, store, and cargo work were all in service of.
    requires: [validated-at-scale]

  # -------------------------------------------------- parallel upstream work
  - id: rdr
    title: RDR — relink, don't rebuild
    status: planned
    category: contrib
    hands: true
    summary: Public-interface hashing so dependents skip rebuilds (compiler-team #790).
    detail: >
      Relink, Don't Rebuild. Expose a crate's public-interface hash so dependents
      rebuild only when the public API changes — not on inlineable / impl-only edits.
      MCP accepted; Cargo + rustc branches exist; DefId-invalidation obstacles remain.
    payoff: ~50% dev-build reductions in early experiments (Zed). A self-contained
      upstream win, separate from the Vixen Build critical path — classic Hexcat work.

  - id: cargo-rustc-patches
    title: Cargo / rustc / sccache patches
    status: planned
    category: contrib
    hands: true
    summary: Targeted upstream patches that speed up Rust builds today.
    detail: Direct contributions to the tools AWS already runs, in their own lane.
    payoff: Lowest-friction value — improve tools they already trust, in parallel
      with the bigger build, and great work to hand to extra hands.
