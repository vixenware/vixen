# Vixen skill tree — the AWS funding map
#
# Audience: AWS (Rust build performance pain, CI + dev workstations; Linux now,
# macOS present, Windows by next year). Prior attempts there: Bazel, a bespoke
# system (Argon, scrapped), and sccache today — useful but can't reuse cache
# across larger swathes of the build graph.
#
# The tree reads left -> right: foundations -> de-risking work -> the three
# fundable "interesting points":
#   1. contrib-funded      targeted upstream contributions (lowest trust needed)
#   2. ccc-funded          cargo-cloud-cache proves value vs sccache (Phase 1)
#   3. vixen-build-funded  Vixen Build funded at AWS scale (the long game)
#
# `payoff` on each node is framed as "why AWS cares" — tie to sccache's ceiling,
# Celina's kill-on-arrival concerns, Jess's "show me something concrete", and the
# don't-be-another-Argon credibility problem.
#
# NOTE: several nodes are flagged [CONFIRM] in their detail — Amos to correct
# scope/status. Status values: done | in_progress | planned | idea.

meta:
  title: Vixen — Skill Tree
  subtitle: Paths to AWS funding — targeted contributions, cargo-cloud-cache (Phase 1), and Vixen Build

categories:
  foundation:
    label: Foundation
    color: "#5b8def"
  contrib:
    label: Targeted contribution
    color: "#4cc9b0"
  ccc:
    label: cargo-cloud-cache (Phase 1)
    color: "#ff7a45"
  derisk:
    label: De-risk (kill-on-arrival)
    color: "#e5544b"
  build:
    label: Vixen Build (long game)
    color: "#c792ea"
  proof:
    label: Proof / funding
    color: "#ffd166"

nodes:
  # ---------------------------------------------------------------- foundations
  - id: lang-frontend
    title: Language front-end
    status: done
    category: foundation
    summary: Parser, IR, type & capability checking — the VIR front-end.
    detail: >
      build / type_collect / resolve / type_check / cap_check / capture. It stays;
      only the evaluator back-end is being replaced. [CONFIRM status=done]
    payoff: A real typed language with a real front-end signals this isn't a weekend toy.

  - id: demand-runtime
    title: Demand-driven runtime
    status: in_progress
    category: foundation
    summary: Lazy demand sea + eager kernel islands; no tree-walker.
    detail: >
      Values are node references; forcing is the only way a scalar appears; commands
      run on executors; everything content-addressed. Mid-rebuild (old eager
      evaluator being removed).
    payoff: Demand-driven + content-addressed evaluation is the bet that makes
      correct cross-graph cache reuse possible at all — the thing sccache can't do.

  - id: exec
    title: exec — the build primitive
    status: in_progress
    category: foundation
    summary: Run a discovered tool in a sandbox; output crosses back as a tree.
    detail: >
      The single build primitive: ship a payload to an executor, run it sandboxed,
      evaluate the observer locally, return only produced values. [CONFIRM status]
    payoff: One auditable primitive for "run a compiler step" is what makes
      placement, sandboxing, and cache keys uniform instead of ad hoc.
    requires: [demand-runtime]

  - id: cache-store
    title: Content-addressed store
    status: in_progress
    category: foundation
    summary: The shared cache backend (vx-store) both products read/write.
    detail: >
      Storage infrastructure, separate from any execution model — CCC and Vixen
      Build can both hit it. [CONFIRM status / how far vx-store is]
    payoff: A real content-addressed store is the substrate for "never rebuild what
      someone already built" — and for on-prem mirrors AWS will require.
    requires: [demand-runtime]

  - id: control-plane
    title: Runners + control plane
    status: planned
    category: foundation
    summary: Long-lived capability-advertising executor daemons; predicate placement.
    detail: >
      Executors detect what their host has installed and advertise it; the
      orchestrator places each exec by predicate. Local orchestrator + LAN
      executors must work with no cloud at all.
    payoff: Distributes build work across CI + dev machines without GitHub-runner
      ephemerality — and runs fully on-prem, which AWS will demand.
    requires: [exec]

  # ---------------------------------------------------- targeted contributions
  - id: rdr
    title: RDR
    status: planned
    category: contrib
    summary: Targeted upstream contribution named in the AWS call.
    detail: >
      [CONFIRM] Need the exact expansion/scope of "RDR" from Amos — listed
      alongside Cargo/rustc/sccache patches as a low-risk fundable contribution.
    payoff: Incremental upstream work AWS can fund with near-zero trust required —
      no bespoke system to adopt, immediate value to their existing toolchain.

  - id: cargo-rustc-patches
    title: Cargo / rustc / sccache patches
    status: planned
    category: contrib
    summary: Targeted upstream patches that make Rust builds faster today.
    detail: >
      Direct contributions to the tools AWS already runs, fixing concrete
      build-perf pain without asking them to switch anything.
    payoff: >
      The lowest-friction ask: fund work on tools they already trust and run.
      Proves we can deliver upstream before they bet on anything bigger.

  - id: contrib-funded
    title: Targeted contributions funded
    status: idea
    category: proof
    summary: AWS funds upstream RDR + Cargo/rustc/sccache work.
    detail: The easiest "yes" — no new system to adopt, just paid upstream impact.
    payoff: First dollars in, relationship established, and a track record that
      de-risks the larger CCC and Vixen Build asks.
    requires: [rdr, cargo-rustc-patches]

  # --------------------------------------------------------- cargo-cloud-cache
  - id: ccc-core
    title: cargo-cloud-cache (CCC)
    status: planned
    category: ccc
    summary: A Cargo fork — the Phase 1 product.
    detail: >
      A drop-in Cargo fork that talks to the content-addressed store. The minimal
      shape that AWS can run on a real workspace. [CONFIRM current state]
    payoff: Ships as a Cargo fork — adoptable with no workflow change, the opposite
      of "rewrite your build in a bespoke DSL" (the Argon failure mode).
    requires: [cache-store]

  - id: ccc-graph-reuse
    title: Reuse across the graph
    status: planned
    category: ccc
    summary: Hit the cache for larger swathes of the build graph than sccache.
    detail: >
      The whole point: avoid rebuilding large portions of the dependency graph,
      not just individual crate compilations sccache can key on.
    payoff: This is the exact gap AWS named — sccache helps but can't avoid
      rebuilding big portions of the graph. Closing it is the headline benchmark.
    requires: [ccc-core]

  - id: ccc-cross-machine
    title: Cross-machine cache hits
    status: planned
    category: ccc
    summary: CI and local/dev workstations share one warm cache.
    detail: >
      A build on a dev laptop hits artifacts produced in CI (and vice versa) —
      both halves of AWS's pain (CI + workstation) served by one cache.
    payoff: Developers stop rebuilding what CI already built. Directly attacks the
      "local/dev workstation builds are slow" half of the problem.
    requires: [ccc-graph-reuse]

  - id: absolute-paths
    title: Absolute-path handling
    status: planned
    category: derisk
    summary: Make cache keys robust to absolute paths in the build.
    detail: >
      Celina's concern: absolute paths embedded in compilation leak machine-specific
      state into artifacts and break cache sharing. [CONFIRM exact failure mode]
    payoff: A named kill-on-arrival concern. Without it, cross-machine hits silently
      miss or, worse, return wrong artifacts — answering it builds trust.
    requires: [ccc-core]

  - id: ccc-on-prem-mirror
    title: On-prem mirror / deployment
    status: planned
    category: derisk
    summary: Run the cache + registry mirror inside AWS's own infra.
    detail: >
      Celina's concern: on-prem mirrors and private deployment. Vixen Build must be
      fully usable with no commercial cloud. [CONFIRM AWS deployment constraints]
    payoff: AWS will not send build artifacts to a third-party cloud. On-prem from
      day one is table stakes, not a later tier.
    requires: [ccc-core]

  - id: beat-sccache
    title: "Benchmark: beat sccache"
    status: planned
    category: proof
    summary: Measured cache hits where sccache is forced to rebuild.
    detail: >
      A reproducible benchmark on a representative Rust workspace showing CCC
      reusing graph regions sccache cannot. [CONFIRM target workspace / metric]
    payoff: A number AWS can verify. Turns "trust us" into "here is the speedup on
      your kind of workload."
    requires: [ccc-graph-reuse]

  - id: concrete-demo
    title: Concrete proof of value
    status: planned
    category: proof
    summary: The "show me something real" Jess asked for.
    detail: >
      An end-to-end demo on an AWS-representative project — not slides — that a
      skeptic can run. [CONFIRM what project / which audience]
    payoff: Jess explicitly asked for something concrete that proves the value.
      This is the artifact that converts skepticism into a funded milestone.
    requires: [beat-sccache]

  - id: ccc-funded
    title: CCC proves value — funded
    status: idea
    category: proof
    summary: AWS funds cargo-cloud-cache as Phase 1.
    detail: The wedge lands — a working Cargo fork with a verified speedup, on-prem.
    payoff: Revenue + a real production user, and the credibility that unlocks the
      Vixen Build conversation.
    requires: [concrete-demo, ccc-cross-machine, absolute-paths, ccc-on-prem-mirror]

  # ----------------------------------------------------------- Vixen Build
  - id: vixen-build-core
    title: Vixen Build — builds a real project
    status: planned
    category: build
    summary: The demand-driven build system builds a non-trivial Rust workspace.
    detail: >
      Beyond caching Cargo: Vixen's own build graph driving a real end-to-end build.
      [CONFIRM how close this is]
    payoff: The long game — a build system that's correct and distributed by
      construction, not a cache bolted onto Cargo.
    requires: [exec, cache-store]

  - id: distributed-build
    title: Distributed execution
    status: idea
    category: build
    summary: Place build work across CI + dev machines via the control plane.
    detail: Orchestrator places each exec on advertised executors, local or remote.
    payoff: Turns a pool of machines into one build fabric — the structural win over
      per-job CI runners and single-machine builds.
    requires: [control-plane, vixen-build-core]

  - id: build-scripts
    title: build.rs support
    status: planned
    category: derisk
    summary: Handle build scripts correctly under caching/distribution.
    detail: Celina's concern — build scripts run arbitrary code with side effects.
    payoff: Real Rust workspaces are full of build.rs. If these break or mis-cache,
      Vixen Build is dead on arrival at AWS.
    requires: [vixen-build-core]

  - id: proc-macros
    title: Proc-macro support
    status: planned
    category: derisk
    summary: Procedural macros compiled and cached correctly.
    detail: Celina's concern — proc macros are compiled host code in the graph.
    payoff: Ubiquitous in AWS's Rust. A build system that can't handle them isn't a
      Rust build system.
    requires: [vixen-build-core]

  - id: native-deps
    title: Native dependencies
    status: planned
    category: derisk
    summary: C/system libraries, -sys crates, linkers, sysroots.
    detail: >
      Celina's concern — native deps drag in host toolchains and absolute paths.
      Ties to hermetic vs host-present toolchain handling.
    payoff: AWS's real graphs aren't pure Rust. Native deps are where naive build
      systems lose correctness — getting them right is a credibility proof.
    requires: [vixen-build-core]

  - id: private-registries
    title: Private registries
    status: planned
    category: derisk
    summary: Resolve and cache from internal/private crate registries.
    detail: Celina's concern — AWS uses private registries, not just crates.io.
    payoff: No enterprise builds against crates.io alone. Must speak their registry.
    requires: [vixen-build-core]

  - id: cache-correctness
    title: Cache correctness
    status: planned
    category: derisk
    summary: Read-set validity — never a wrong hit, never a missed invalidation.
    detail: >
      Cache key = inputs computed before running; read-set = post-hoc validity, never
      the key. A wrong cache hit is worse than a slow build.
    payoff: One incorrect artifact destroys trust permanently. Provable correctness
      is the single most important thing a skeptic checks.
    requires: [vixen-build-core]

  - id: fixup-distribution
    title: Fixup distribution
    status: planned
    category: derisk
    summary: Distributing build fixups / overrides across the fleet.
    detail: >
      [CONFIRM] Celina raised "fixup distribution" — need Amos to pin down exactly
      what this means (build-script fixups? patch/override propagation?).
    payoff: A concern AWS named directly; answering it specifically shows we listened.
    requires: [vixen-build-core]

  - id: platforms
    title: Linux + macOS + Windows
    status: planned
    category: derisk
    summary: Linux now, macOS present, Windows by next year.
    detail: >
      AWS: Linux is the main platform, macOS very present, Windows most likely
      required next year.
    payoff: Matches AWS's actual platform matrix. Windows on the roadmap signals we
      build for their reality, not just ours.
    requires: [vixen-build-core]

  - id: not-another-argon
    title: Not another Argon
    status: idea
    category: proof
    summary: Overcome bespoke-build-system skepticism — by having shipped CCC first.
    detail: >
      AWS scrapped a bespoke system (Argon); they are rightly wary. The answer is
      sequencing: CCC ships and proves value before Vixen Build is asked for.
    payoff: Reframes Vixen Build from "trust our new system" to "the team that
      already shipped you a working speedup is now going further."
    requires: [ccc-funded]

  - id: prove-at-scale
    title: Proven at AWS scale
    status: idea
    category: proof
    summary: Vixen Build clears the real concerns on a real AWS workload.
    detail: >
      The collaboration half of the ask: AWS feedback on whether it works at scale,
      across their actual graphs and platforms.
    payoff: Collaboration AWS values as much as money — and the only way to know
      Vixen Build survives contact with a graph their size.
    requires: [build-scripts, proc-macros, native-deps, cache-correctness, distributed-build]

  - id: vixen-build-funded
    title: Vixen Build funded at AWS
    status: idea
    category: proof
    summary: The long game lands — funded, on-prem, cross-platform, proven.
    detail: The capstone — Vixen Build adopted and funded as the path past sccache.
    payoff: >
      The outcome the whole tree builds toward: AWS funding the demand-driven
      build system because every kill-on-arrival concern has a concrete answer.
    requires: [prove-at-scale, not-another-argon, platforms, private-registries, ccc-on-prem-mirror]
