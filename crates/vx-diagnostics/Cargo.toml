[package]
name = "vx-diagnostics"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata]

[package.metadata."docs.rs"]
rustdoc-args = ["--html-in-header", "arborium-header.html"]

[dependencies]
eyre = { workspace = true }
libc = { workspace = true }
margin = { workspace = true }
margin-term = { workspace = true }
arborium = { workspace = true }
arborium-highlight = { workspace = true }
arborium-theme = { workspace = true }
terminal-light = { workspace = true }
tree-sitter-vixen = { path = "../tree-sitter-vixen", version = "0.1.0" }
vx-ir = { workspace = true }
vx-parser = { workspace = true }
vx-stdlib = { workspace = true }
vx-types = { workspace = true }

[dev-dependencies]
margin = { path = "../../crates-plus/margin" }
vx-ir = { path = "../vx-ir" }
# `compile_source` (the checked front-end) lives in the engine now — checking
# forces values, so it moved in with the evaluator.
vx-runtime = { path = "../vx-runtime" }
vx-parser = { path = "../vx-parser" }
vx-types = { path = "../vx-types" }

[lints]
workspace = true
