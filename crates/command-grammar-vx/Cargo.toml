[package]
name = "command-grammar-vx"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Load command-model grammars authored in Vixen (.vx) via the Vixen parser — no evaluator."

[package.metadata]

[package.metadata."docs.rs"]
rustdoc-args = ["--html-in-header", "arborium-header.html"]

[dependencies]
command-model = { path = "../command-model" }
# The workspace parser — one shared instance with the rest of Vixen (vx-ir et
# al.), so a CLI-literal AST here is the *same type* the compiler front-end sees.
# (Was a git pin during the prototype; now integrated.)
vx-parser = { workspace = true }

[dev-dependencies]
vx-parser = { path = "../../crates/vx-parser" }

[lints]
workspace = true
