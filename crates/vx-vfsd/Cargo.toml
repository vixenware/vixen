[package]
name = "vx-vfsd"
version.workspace = true
edition.workspace = true

[package.metadata]

[package.metadata."docs.rs"]
rustdoc-args = ["--html-in-header", "arborium-header.html"]

[lib]
name = "vx_vfsd"
path = "src/lib.rs"

[[bin]]
name = "vx-vfsd"
path = "src/main.rs"

[dependencies]
# Internal
vx-store-proto = { workspace = true }
vixenfs-proto = { workspace = true }
vx-vfs = { workspace = true }

# RPC
roam = { workspace = true }
roam-session = { workspace = true }
peeps = { workspace = true }
roam-stream = { workspace = true }
vx-io = { workspace = true }

# Async runtime
tokio = { workspace = true }

# Serialization
facet = { workspace = true }

# CLI
figue = { workspace = true }

# Utilities
camino = { workspace = true }
fastrand = { workspace = true }
futures-util = { workspace = true }
cfg-if = { workspace = true }
tracing = { workspace = true }
ur-taking-me-with-you = { workspace = true }
vx-tracing.workspace = true
owo-colors.workspace = true
strip-ansi-escapes.workspace = true

[dev-dependencies]
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dependencies.roam-shm]
workspace = true
optional = true

[target.'cfg(target_os = "macos")'.dependencies]
roam-shm = { workspace = true }

[features]
default = []
diagnostics = ["peeps/diagnostics", "roam-session/diagnostics", "dep:roam-shm", "roam-shm/diagnostics"]

[lints]
workspace = true
