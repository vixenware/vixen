[package]
name = "vx-vfsd"
version.workspace = true
edition.workspace = true

[package.metadata]

[package.metadata."docs.rs"]
rustdoc-args = ["--html-in-header", "arborium-header.html"]

[lib]
name = "vx_vfsd"
path = "src/lib.rs"

[[bin]]
name = "vx-vfsd"
path = "src/main.rs"

[dependencies]
# Internal
vx-store-proto = { workspace = true }
vx-locks = { workspace = true }
vixenfs-proto = { workspace = true }
vx-vfs = { workspace = true }

# RPC
roam = { workspace = true }
roam-stream = { workspace = true }
roam-shm = { workspace = true }
vx-io = { workspace = true }

# Async runtime
tokio = { workspace = true }

# Serialization
facet = { workspace = true }
facet-json = { workspace = true }

# CLI
figue = { workspace = true }

# Utilities
camino = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = "0.3"
ur-taking-me-with-you = { workspace = true }
libc = { workspace = true }

[features]
default = []
diagnostics = ["vx-locks/diagnostics", "roam-shm/diagnostics"]
