[package]
name = "vx-toolchain"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
blake3 = { workspace = true }
camino = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
eyre = { workspace = true }
facet = { workspace = true }
facet-json = { workspace = true }
facet-toml = { workspace = true }
facet-value = { workspace = true }
lzma-rs = "0.3"
tar = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
vx-cass-proto = { workspace = true }
walkdir = "2.5"
# pin idna_adapter to 1.0.0 to avoid pulling in ICU for Unicode IDNA processing
# (we only fetch from known ASCII hosts like GitHub)
idna_adapter = "=1.0.0"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
uuid = { version = "1.19.0", features = ["v4"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
