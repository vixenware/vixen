[package]
name = "vx-daemon"
publish = false
version.workspace = true
edition.workspace = true

[package.metadata.cargo-shear]
ignored = ["moire"]

[package.metadata]

[package.metadata."docs.rs"]
rustdoc-args = ["--html-in-header", "arborium-header.html"]

[dependencies]
vox = { workspace = true }
moire = { workspace = true }
tokio = { workspace = true }
futures-util = { workspace = true }
camino = { workspace = true }
eyre = { workspace = true }
tracing = { workspace = true }
facet = { workspace = true }
facet-styx = { workspace = true }
blake3 = { workspace = true }

vx-exec-protocol.workspace = true
vx-services.workspace = true
vx-ir.workspace = true
vx-parser.workspace = true
margin.workspace = true
vx-store = { path = "../vx-store" }
vx-runner = { path = "../vx-runner" }
vx-vfsd = { path = "../vx-vfsd" }
# The demand-driven runtime: the daemon's test surface runs .vx tests through it
# (the eager runtime_eval is gone). The sole evaluator entry point.
vx-runtime = { path = "../vx-runtime" }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
