[package]
name = "vx-daemon"
version.workspace = true
edition.workspace = true

[package.metadata]

[package.metadata."docs.rs"]
rustdoc-args = ["--html-in-header", "arborium-header.html"]

[dependencies]
vox = { workspace = true }
moire = { workspace = true }
tokio = { workspace = true }
camino = { workspace = true }
eyre = { workspace = true }
tracing = { workspace = true }

vx-services.workspace = true
vx-store = { path = "../vx-store" }

[features]
default = []
diagnostics = ["moire/diagnostics"]

[dev-dependencies]
ariadne = { version = "0.6", features = ["auto-color"] }
arborium = { workspace = true }
arborium-highlight = { workspace = true }
arborium-theme = { workspace = true }
concolor = { version = "0.1", features = ["api"] }
tree-sitter-vixen = { git = "https://github.com/bearcove/tree-sitter-vixen", rev = "9fe14bea91399543282035090086fec8a868fb6c" }

[lints]
workspace = true
