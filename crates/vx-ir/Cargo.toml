[package]
name = "vx-ir"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata]

[package.metadata."docs.rs"]
rustdoc-args = ["--html-in-header", "arborium-header.html"]

[dependencies]
vx-types = { workspace = true }
vx-parser = { workspace = true }
vx-package = { workspace = true }
vx-stdlib = { workspace = true }
margin = { workspace = true }
facet = { workspace = true }
facet-json = { workspace = true }
blake3 = { workspace = true }
# CLI-literal grammar checking: the engine (command-model) + the authoring-vocab
# loader (command-grammar-vx) that turns a grammar package's source into a
# GrammarSet without evaluation. Checking `@cc[ … ]` against its grammar is a
# core language feature, so the front-end depends on them directly.
command-model = { path = "../../crates-plus/command-model" }
command-grammar-vx = { path = "../../crates-plus/command-grammar-vx" }

[dev-dependencies]
