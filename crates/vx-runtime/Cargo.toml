[package]
name = "vx-runtime"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata]

[package.metadata."docs.rs"]
rustdoc-args = ["--html-in-header", "arborium-header.html"]

# The demand-driven Vixen runtime: the lazy demand sea + eager pure kernel
# islands. Replaces the eager evaluator (vx-daemon runtime_eval) and vx-rt.
# See docs/design/runtime-graph-execution/README.md for the current execution
# roadmap and anti-fallback checklist.

[dependencies]
facet = { workspace = true }
facet-json = { workspace = true }
vx-runtime-graph = { path = "../vx-runtime-graph" }
vx-runtime-core = { path = "../vx-runtime-core" }
vx-runtime-driver = { path = "../vx-runtime-driver" }
vx-exec-protocol = { workspace = true }
vx-ir = { workspace = true }
vx-parser = { workspace = true }
vx-stdlib = { workspace = true }
vx-types = { workspace = true }
# The engine owns the checked semantic front-end (`compile`): checking forces
# values, so it lives with the evaluator (see the wiki: "Checking is forcing").
# Resolving `@scope/name` packages for that front-end needs the package resolver.
vx-package = { path = "../vx-package" }
# command-model is pure projection (grammar + argv -> classified I/O + canonical
# form, no I/O). The runtime Command value (what a CLI literal evaluates to and exec
# consumes) wraps its EffectiveCommand with the execution argv + the outputs.
command-model = { path = "../../crates-plus/command-model" }
# `host.exec` Blake3-hashes the binary it runs (exec implies hash — running a tool
# depends on its exact bytes), so the probe's CToolchain carries that fingerprint.
blake3 = { workspace = true }
# The copy-and-patch JIT substrate (executable memory + AArch64 relocation
# patching). Only the runtime surface (ExecBuf, patch_branch26) — the smoke test,
# arithmetic stencils, and kernel→stencil-chain lowering stay in this crate.
copypatch = { workspace = true }
# Stackful coroutines: the strand scheduler runs each strand on its own real stack
# (dumpable, steppable, off-CPU-profilable) instead of an async future. Workers own
# their coroutines — a strand never migrates threads, so eval stays single-threaded.
corosensei = { workspace = true }
# Remote handles are async by nature — forcing an unproduced part suspends until the
# producer yields it. The cross-executor harness runs the producer↔consumer exchange
# over vox (transport-local, in-process) — the real wire, not raw channels. The boss
# drives those vox forces on a current-thread runtime; futures-util's FuturesUnordered
# holds the in-flight ones (on the boss thread — no Send bound on the vox futures).
tokio = { workspace = true }
futures-util = { workspace = true }
vox = { workspace = true }

[build-dependencies]
# Build-time stencil extraction: compile stencils/stencils.rs with rustc
# (--emit=obj) and pull each stencil's bytes + continuation relocs by symbol.
copypatch = { workspace = true, features = ["build"] }

[dev-dependencies]
# The CLI-literal checker tests reconstruct the front-end pipeline and load grammar
# packages directly (the same loader vx-ir's `front_end_resolved` uses).
command-grammar-vx = { path = "../../crates-plus/command-grammar-vx" }
