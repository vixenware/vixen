[package]
name = "landlock-exec"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata]

[package.metadata."docs.rs"]
rustdoc-args = ["--html-in-header", "arborium-header.html"]

[target.'cfg(target_os = "linux")'.dependencies]
# General sandboxing
seccompiler = "0.5.0"
landlock = "0.4.5"

# For identifying files, do not allow running arbitrary executables e.g. in include_bytes macros! or similar
magic = "0.16.7"
which = "8.0.4"
libc = { workspace = true }

[lints]
workspace = true
