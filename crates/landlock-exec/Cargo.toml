[package]
name = "landlock-exec"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata]

[package.metadata."docs.rs"]
rustdoc-args = ["--html-in-header", "arborium-header.html"]

[target.'cfg(target_os = "linux")'.dependencies]
# General sandboxing
seccompiler = "0.5.0"
landlock = "0.4.5"

# Hardened-malloc
hardened-malloc = "16.0.2026060603" # By GrapheneOS
secmem-proc = "0.3.8"
libc = { workspace = true }

# GrapheneOS does not support 32-bit.
[target.'cfg(all(target_pointer_width = "64", target_os = "linux"))'.dependencies]
hardened-malloc = { version = "16" }

[lints]
workspace = true
