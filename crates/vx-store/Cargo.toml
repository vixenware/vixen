[package]
name = "vx-store"
version.workspace = true
edition.workspace = true

[package.metadata]

[package.metadata."docs.rs"]
rustdoc-args = ["--html-in-header", "arborium-header.html"]

[lib]
name = "vx_store"
path = "src/lib.rs"

[dependencies]
camino = { workspace = true }
eyre = { workspace = true }

moire = { workspace = true }

tracing = { workspace = true }
vx-services = { path = "../vx-services" }

vx-io = { workspace = true }

[dev-dependencies]
vx-io = { path = "../vx-io" }
vx-services = { path = "../vx-services" }

[features]
default = []
diagnostics = ["moire/diagnostics"]

[lints]
workspace = true
