[package]
name = "vx"
version.workspace = true
edition.workspace = true

[package.metadata]

[package.metadata."docs.rs"]
rustdoc-args = ["--html-in-header", "arborium-header.html"]

[package.metadata.cargo-shear]
ignored = ["roam-stream", "vx-vfs"]

[dependencies]
moire = { workspace = true }
facet = { workspace = true }
figue = { workspace = true }
facet-json = { workspace = true }
eyre = { workspace = true }
libc = { workspace = true }
owo-colors = { workspace = true }
camino = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
vx-tracing = { workspace = true }
tracing-subscriber = { workspace = true }
roam-core = { workspace = true }
roam-types = { workspace = true }
roam-stream = { workspace = true }
indicatif = { workspace = true }
vxd-proto = { workspace = true }
vx-store-proto = { workspace = true }
vx-io = { workspace = true }
vx-report = { workspace = true }
vx-vfs = { workspace = true }
strip-ansi-escapes = { workspace = true }
unicode-width = { workspace = true }
ariadne = { version = "0.6", features = ["auto-color"] }
arborium = { path = "/Users/amos/bearcove/arborium/crates/arborium", default-features = false }
arborium-highlight = { path = "/Users/amos/bearcove/arborium/crates/arborium-highlight" }
arborium-theme = { path = "/Users/amos/bearcove/arborium/crates/arborium-theme" }
tree-sitter-vixen = { path = "/Users/amos/bearcove/tree-sitter-vixen" }

[features]
default = []
diagnostics = ["moire/diagnostics", "roam-stream/diagnostics", "vx-vfs/diagnostics"]

[dev-dependencies]
concolor = { version = "0.1", features = ["api"] }
indoc = "2"

[lints]
workspace = true
