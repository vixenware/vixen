[package]
name = "vx"
version.workspace = true
edition.workspace = true

[package.metadata]

[package.metadata."docs.rs"]
rustdoc-args = ["--html-in-header", "arborium-header.html"]

[package.metadata.cargo-shear]
ignored = ["roam-stream", "vx-vfs"]

[dependencies]
moire = { workspace = true }
facet = { workspace = true }
figue = { workspace = true }
facet-json = { workspace = true }
eyre = { workspace = true }
libc = { workspace = true }
owo-colors = { workspace = true }
camino = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
vx-tracing = { workspace = true }
tracing-subscriber = { workspace = true }
roam-core = { workspace = true }
roam-types = { workspace = true }
roam-stream = { workspace = true }
indicatif = { workspace = true }
vx-services.workspace = true
vx-io = { workspace = true }
vx-vfs = { workspace = true }
margin = { workspace = true }
margin-term = { workspace = true }
strip-ansi-escapes = { workspace = true }
unicode-width = { workspace = true }
arborium = { workspace = true }
arborium-highlight = { workspace = true }
arborium-theme = { workspace = true }
tree-sitter-vixen = { git = "https://github.com/bearcove/tree-sitter-vixen", rev = "9fe14bea91399543282035090086fec8a868fb6c" }

[features]
default = []
diagnostics = ["moire/diagnostics", "roam-stream/diagnostics", "vx-vfs/diagnostics"]

[dev-dependencies]
concolor = { version = "0.1", features = ["api"] }
indoc = "2"

[lints]
workspace = true
