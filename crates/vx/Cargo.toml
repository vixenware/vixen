[package]
name = "vx"
version.workspace = true
edition.workspace = true
autobins = false

[[bin]]
name = "vixen"
path = "src/bin/vixen.rs"

[[bin]]
name = "vx"
path = "src/main.rs"

[package.metadata]

[package.metadata."docs.rs"]
rustdoc-args = ["--html-in-header", "arborium-header.html"]

[package.metadata.cargo-shear]
ignored = ["vx-vfs", "moire"]

[dependencies]
moire = { workspace = true }
facet = { workspace = true }
figue = { workspace = true }
eyre = { workspace = true }
camino = { workspace = true }
tokio = { workspace = true }
tracing-subscriber = { workspace = true }
vox = { workspace = true }
blake3 = { workspace = true }
vx-services.workspace = true
vxd.workspace = true
vx-lsp = { path = "../vx-lsp" }
vx-vfs = { workspace = true }
vx-vfsd = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
