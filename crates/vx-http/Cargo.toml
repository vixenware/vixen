[package]
name = "vx-http"
version.workspace = true
edition.workspace = true

[dependencies]
http-body-util = "0.1"
hyper = { version = "1.8", features = ["client", "http1", "http2"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "native-tokio", "aws-lc-rs", "tls12"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "http2", "tokio"] }
thiserror = { workspace = true }
tracing = { workspace = true }
