[package]
name = "fuse3"
version = "0.8.1"
edition = "2024"
license = "MIT"
description = "Simplified FUSE library for Linux/tokio, vendored from github.com/Sherlock-Holo/fuse3"

[package.metadata]

[package.metadata."docs.rs"]
rustdoc-args = ["--html-in-header", "arborium-header.html"]

[features]
telemetry = []

[dependencies]
async-notify = "0.3"
bincode-next = { version = "2.1.0", default-features = false, features = ["derive", "std"] }
bytes = "1.11"
futures-channel = { version = "0.3.32", features = ["sink"] }
futures-util = { version = "0.3.32", features = ["sink"] }
libc = "0.2.182"
nix = { version = "0.31.2", default-features = false, features = ["fs", "mount", "user", "socket"] }
tracing = "0.1.44"
trait-make = "0.1"
which = "8"
tokio = { version = "1.50", features = ["fs", "rt", "sync", "net", "macros", "process", "time"] }
moire = { workspace = true }
