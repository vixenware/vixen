[package]
name = "vx-runner"
version.workspace = true
edition.workspace = true

[lib]
name = "vx_runner"
path = "src/lib.rs"

[[bin]]
name = "vx-runner"
path = "src/main.rs"

[features]
default = []
diagnostics = ["moire/diagnostics"]

[package.metadata]

[package.metadata."docs.rs"]
rustdoc-args = ["--html-in-header", "arborium-header.html"]

[dependencies]
facet = { workspace = true }
figue = { workspace = true }
vox = { workspace = true }
tokio = { workspace = true }
eyre = { workspace = true }
tracing = { workspace = true }

vx-services.workspace = true
vx-io = { workspace = true }
moire = { workspace = true }

[lints]
workspace = true
