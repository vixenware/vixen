[package]
name = "vx-lsp"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata]

[package.metadata."docs.rs"]
rustdoc-args = ["--html-in-header", "arborium-header.html"]

[lib]
name = "vx_lsp"
path = "src/lib.rs"

[[bin]]
name = "vx-lsp"
path = "src/main.rs"

[dependencies]
vx-parser = { workspace = true }
vx-ir = { workspace = true }
# The checker (type-check + error-union) lives in the engine now — checking forces
# values (see the wiki: "Checking is forcing; the checker lives in the engine"), so
# the LSP is a client of the engine, as the design always intended.
vx-runtime = { path = "../vx-runtime" }
vx-stdlib = { workspace = true }
vx-types = { workspace = true }
eyre = { workspace = true }
rowan = "0.16"
tokio = { workspace = true }
tracing = { workspace = true }
tower-lsp = "0.20"

[lints]
workspace = true
