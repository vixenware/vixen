name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ forgejo.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      matrix:
        runner: [mac, linux-x86_64-trusted]
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_INCREMENTAL: "1"
      VX_REPO_URL: https://code.vixen.rs/vixen/vixen.git
      VX_SHA: ${{ forgejo.sha }}
    steps:
      - name: Checkout repository
        run: |
          mkdir -p "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git init
          git remote remove origin 2>/dev/null || true
          git remote add origin "$VX_REPO_URL"
          git -c http.extraHeader="Authorization: token ${FORGEJO_TOKEN}" fetch --depth 1 origin "$VX_SHA"
          git checkout --detach FETCH_HEAD

      - name: Prepare Rust toolchain
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          fi
          if [ -n "${GITHUB_PATH:-}" ]; then
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          . "$HOME/.cargo/env" 2>/dev/null || true
          rustc --version
          cargo --version

      - run: |
          . "$HOME/.cargo/env" 2>/dev/null || true
          CARGO_TARGET_DIR="$HOME/.cache/vixen/forgejo-target" cargo check --workspace --all-targets

  clippy:
    strategy:
      matrix:
        runner: [mac, linux-x86_64-trusted]
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_INCREMENTAL: "1"
      VX_REPO_URL: https://code.vixen.rs/vixen/vixen.git
      VX_SHA: ${{ forgejo.sha }}
    steps:
      - name: Checkout repository
        run: |
          mkdir -p "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git init
          git remote remove origin 2>/dev/null || true
          git remote add origin "$VX_REPO_URL"
          git -c http.extraHeader="Authorization: token ${FORGEJO_TOKEN}" fetch --depth 1 origin "$VX_SHA"
          git checkout --detach FETCH_HEAD

      - name: Prepare Rust toolchain
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          fi
          if [ -n "${GITHUB_PATH:-}" ]; then
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          . "$HOME/.cargo/env" 2>/dev/null || true
          rustc --version
          cargo --version

      - name: Prepare clippy
        run: |
          . "$HOME/.cargo/env" 2>/dev/null || true
          rustup component add clippy

      - run: |
          . "$HOME/.cargo/env" 2>/dev/null || true
          CARGO_TARGET_DIR="$HOME/.cache/vixen/forgejo-target" cargo clippy --workspace --all-targets

  tests:
    strategy:
      matrix:
        runner: [mac, linux-x86_64-trusted]
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_INCREMENTAL: "1"
      VX_REPO_URL: https://code.vixen.rs/vixen/vixen.git
      VX_SHA: ${{ forgejo.sha }}
    steps:
      - name: Checkout repository
        run: |
          mkdir -p "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git init
          git remote remove origin 2>/dev/null || true
          git remote add origin "$VX_REPO_URL"
          git -c http.extraHeader="Authorization: token ${FORGEJO_TOKEN}" fetch --depth 1 origin "$VX_SHA"
          git checkout --detach FETCH_HEAD

      - name: Prepare Rust toolchain
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          fi
          if [ -n "${GITHUB_PATH:-}" ]; then
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          . "$HOME/.cargo/env" 2>/dev/null || true
          rustc --version
          cargo --version

      - name: Install cargo-nextest if needed
        run: |
          . "$HOME/.cargo/env" 2>/dev/null || true
          if ! cargo nextest --version >/dev/null 2>&1; then
            cargo install cargo-nextest --locked
          fi

      - run: |
          . "$HOME/.cargo/env" 2>/dev/null || true
          CARGO_TARGET_DIR="$HOME/.cache/vixen/forgejo-target" cargo nextest run --workspace --no-fail-fast --status-level fail --final-status-level fail
