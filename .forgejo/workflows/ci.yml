name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

concurrency:
    group: ci-${{ forgejo.ref }}
    cancel-in-progress: true

env:
    CARGO_INCREMENTAL: "1"
    VX_REPO_URL: https://code.vixen.rs/vixen/vixen.git
    VX_SHA: ${{ forgejo.sha }}

jobs:
    mac:
        name: mac
        runs-on: aarch64-apple-darwin
        steps:
            - name: Checkout repository
              run: |
                  mkdir -p "$GITHUB_WORKSPACE"
                  cd "$GITHUB_WORKSPACE"
                  git init
                  git remote remove origin 2>/dev/null || true
                  git remote add origin "$VX_REPO_URL"
                  git -c http.extraHeader="Authorization: token ${FORGEJO_TOKEN}" fetch --depth 1 origin "$VX_SHA"
                  git checkout --detach FETCH_HEAD

            - name: Prepare Rust toolchain
              run: |
                  if ! command -v cargo >/dev/null 2>&1; then
                    curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --component clippy
                  fi
                  rustup component add clippy 2>/dev/null || true
                  if [ -n "${GITHUB_PATH:-}" ]; then
                    echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
                  fi
                  . "$HOME/.cargo/env" 2>/dev/null || true
                  rustc --version
                  cargo --version
                  cargo clippy --version

            - name: Install cargo-nextest if needed
              run: |
                  . "$HOME/.cargo/env" 2>/dev/null || true
                  if ! cargo nextest --version >/dev/null 2>&1; then
                    cargo install cargo-nextest --locked
                  fi

            - name: Clippy
              run: |
                  . "$HOME/.cargo/env" 2>/dev/null || true
                  CARGO_TARGET_DIR="$HOME/.cache/vixen/forgejo-target" cargo clippy --workspace --all-targets

            - name: Tests
              run: |
                  . "$HOME/.cargo/env" 2>/dev/null || true
                  CARGO_TARGET_DIR="$HOME/.cache/vixen/forgejo-target" cargo nextest run --workspace --no-fail-fast --status-level fail --final-status-level fail

    linux:
        name: linux
        runs-on: x86_64-unknown-linux-gnu
        container:
            image: code.vixen.rs/vixen/vixen-ci:latest
            volumes:
                - /srv/ci/cache/vixen:/ci-cache
        env:
            CARGO_HOME: /ci-cache/cargo
            CARGO_TARGET_DIR: /ci-cache/target/ci-linux
        steps:
            - name: Checkout repository
              run: |
                  mkdir -p "$GITHUB_WORKSPACE"
                  cd "$GITHUB_WORKSPACE"
                  git init
                  git remote remove origin 2>/dev/null || true
                  git remote add origin "$VX_REPO_URL"
                  git -c http.extraHeader="Authorization: token ${FORGEJO_TOKEN}" fetch --depth 1 origin "$VX_SHA"
                  git checkout --detach FETCH_HEAD

            - name: Show toolchain
              run: |
                  mkdir -p "$CARGO_HOME" "$CARGO_TARGET_DIR"
                  rustc --version
                  cargo --version
                  cargo clippy --version
                  cargo nextest --version

            - name: Clippy
              run: cargo clippy --workspace --all-targets

            - name: Tests
              run: cargo nextest run --workspace --no-fail-fast --status-level fail --final-status-level fail

    windows:
        name: windows
        runs-on: windows-amd64
        env:
            CARGO_HOME: 'C:\Users\runner\.cargo'
            CARGO_TARGET_DIR: 'C:\Users\runner\.cache\vixen\target\ci-windows'
        defaults:
            run:
                shell: powershell
        steps:
            - name: Checkout repository
              run: |
                  New-Item -ItemType Directory -Force -Path $env:GITHUB_WORKSPACE | Out-Null
                  Set-Location $env:GITHUB_WORKSPACE
                  git init
                  git remote add origin $env:VX_REPO_URL
                  git -c http.extraHeader="Authorization: token $env:FORGEJO_TOKEN" fetch --depth 1 origin $env:VX_SHA
                  git checkout --detach FETCH_HEAD

            - name: Prepare Rust toolchain
              run: |
                  $cargoBin = Join-Path $env:CARGO_HOME "bin"
                  New-Item -ItemType Directory -Force -Path $env:CARGO_HOME | Out-Null
                  New-Item -ItemType Directory -Force -Path $env:CARGO_TARGET_DIR | Out-Null
                  New-Item -ItemType Directory -Force -Path $cargoBin | Out-Null
                  $env:PATH = "$cargoBin;$env:PATH"
                  if (-not (Get-Command cargo -ErrorAction SilentlyContinue)) {
                    Invoke-WebRequest -Uri 'https://win.rustup.rs/x86_64' -OutFile 'rustup-init.exe'
                    ./rustup-init.exe -y --profile minimal --component clippy
                  }
                  if ($env:GITHUB_PATH) { Add-Content -Path $env:GITHUB_PATH -Value $cargoBin }
                  cmd /c "cargo clippy --version >NUL 2>NUL"
                  if ($LASTEXITCODE -ne 0) {
                    rustup component add clippy
                    if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                  }
                  rustc --version
                  cargo --version
                  cargo clippy --version

            - name: Install cargo-nextest if needed
              run: |
                  if (-not (Get-Command cargo-nextest -ErrorAction SilentlyContinue)) {
                    $tmp = New-TemporaryFile | Rename-Item -NewName { $_ -replace 'tmp$', 'zip' } -PassThru
                    Invoke-WebRequest -OutFile $tmp https://get.nexte.st/latest/windows
                    $outputDir = if ($Env:CARGO_HOME) { Join-Path $Env:CARGO_HOME "bin" } else { Join-Path $Env:USERPROFILE ".cargo\bin" }
                    New-Item -ItemType Directory -Force -Path $outputDir | Out-Null
                    $tmp | Expand-Archive -DestinationPath $outputDir -Force
                    $tmp | Remove-Item
                  }
                  cargo nextest --version

            # vx-management is a macOS-only privileged daemon (POSIX libc); it does not
            # build on Windows. vx-fskit/fuse3/landlock-exec already self-gate, so the
            # rest of the workspace — including the vx-vfs + windows-projfs path — is
            # what this job exercises.
            - name: Clippy
              run: cargo clippy --workspace --exclude vx-management --all-targets

            - name: Tests
              run: cargo nextest run --workspace --exclude vx-management --no-fail-fast --status-level fail --final-status-level fail
