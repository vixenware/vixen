name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ forgejo.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: mac
    env:
      VX_REPO_URL: https://code.vixen.rs/vixen/vixen.git
      VX_SHA: ${{ forgejo.sha }}
    steps:
      - name: Checkout repository
        run: |
          mkdir -p "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git init
          git remote remove origin 2>/dev/null || true
          git remote add origin "$VX_REPO_URL"
          git -c http.extraHeader="Authorization: token ${FORGEJO_TOKEN}" fetch --depth 1 origin "$VX_SHA"
          git checkout --detach FETCH_HEAD

      - name: Show Rust toolchain
        run: |
          rustc --version
          cargo --version

      - run: cargo check --workspace --all-targets

  clippy:
    runs-on: mac
    env:
      VX_REPO_URL: https://code.vixen.rs/vixen/vixen.git
      VX_SHA: ${{ forgejo.sha }}
    steps:
      - name: Checkout repository
        run: |
          mkdir -p "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git init
          git remote remove origin 2>/dev/null || true
          git remote add origin "$VX_REPO_URL"
          git -c http.extraHeader="Authorization: token ${FORGEJO_TOKEN}" fetch --depth 1 origin "$VX_SHA"
          git checkout --detach FETCH_HEAD

      - name: Prepare clippy
        run: rustup component add clippy

      - run: cargo clippy --workspace --all-targets

  tests:
    runs-on: mac
    env:
      VX_REPO_URL: https://code.vixen.rs/vixen/vixen.git
      VX_SHA: ${{ forgejo.sha }}
    steps:
      - name: Checkout repository
        run: |
          mkdir -p "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git init
          git remote remove origin 2>/dev/null || true
          git remote add origin "$VX_REPO_URL"
          git -c http.extraHeader="Authorization: token ${FORGEJO_TOKEN}" fetch --depth 1 origin "$VX_SHA"
          git checkout --detach FETCH_HEAD

      - name: Install cargo-nextest if needed
        run: |
          if ! cargo nextest --version >/dev/null 2>&1; then
            cargo install cargo-nextest --locked
          fi

      - run: cargo nextest run --workspace --no-fail-fast --status-level fail --final-status-level fail
