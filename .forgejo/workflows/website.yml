name: Website

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.config/dodeca.styx'
      - '.forgejo/workflows/website.yml'
      - 'CNAME'
  workflow_dispatch:

concurrency:
  group: website-${{ forgejo.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: linux-x86_64-trusted
    env:
      VX_REPO_URL: https://code.vixen.rs/vixen/vixen.git
      VX_SHA: ${{ forgejo.sha }}
    steps:
      - name: Prepare job container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git

      - name: Checkout repository
        run: |
          git init "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "$VX_REPO_URL"
          git -c http.extraHeader="Authorization: token ${FORGEJO_TOKEN}" fetch --depth 1 origin "$VX_SHA"
          git checkout --detach FETCH_HEAD

      - name: Install dodeca
        run: |
          if ! command -v ddc >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -LsSf https://github.com/bearcove/dodeca/releases/latest/download/dodeca-installer.sh | sh
          fi

      - name: Build website
        run: |
          if command -v ddc >/dev/null 2>&1; then
            ddc build
          else
            ~/.cargo/bin/ddc build
          fi

      - name: Copy CNAME to output
        run: cp CNAME docs/public/
