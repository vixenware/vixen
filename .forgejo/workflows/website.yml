name: Website

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.config/dodeca.styx'
      - '.forgejo/workflows/website.yml'
      - 'CNAME'
  workflow_dispatch:

concurrency:
  group: website-${{ forgejo.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: mac
    env:
      VX_REPO_URL: https://code.vixen.rs/vixen/vixen.git
      VX_SHA: ${{ forgejo.sha }}
    steps:
      - name: Checkout repository
        run: |
          mkdir -p "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git init
          git remote remove origin 2>/dev/null || true
          git remote add origin "$VX_REPO_URL"
          git -c http.extraHeader="Authorization: token ${FORGEJO_TOKEN}" fetch --depth 1 origin "$VX_SHA"
          git checkout --detach FETCH_HEAD

      - name: Install dodeca
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/bearcove/dodeca/releases/latest/download/dodeca-installer.sh | sh

      - name: Build website
        run: |
          ~/.cargo/bin/ddc build .

      - name: Copy CNAME to output
        run: cp CNAME docs/public/
