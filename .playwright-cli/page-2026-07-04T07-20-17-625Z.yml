      - textbox [ref=f2e68]:
        - generic [ref=f2e69]: // lua.vix — Lua 5.4 for any target the fleet can serve.
        - generic [ref=f2e71]: "use vix::{Tree, Path, Target};"
        - generic [ref=f2e72]: "use caps::{Cc, Ar};"
        - generic [ref=f2e74]: "/// Lua's sources, pinned by content. `fetch` is pure: the checksum IS the identity;"
        - generic [ref=f2e75]: /// the URL is only a hint about where satisfying bytes may be found.
        - generic [ref=f2e76]: "fn sources() -> Tree {"
        - generic [ref=f2e77]: let tar = fetch(
        - generic [ref=f2e78]: "url: \"https://www.lua.org/ftp/lua-5.4.8.tar.gz\","
        - generic [ref=f2e79]: "sha256: \"4f18ddae154e9f5d79f21e9a6ba48e5b5f5b2e6ab5e2c4a1e0d3b7f1b7de00d1\","
        - generic [ref=f2e80]: );
        - generic [ref=f2e81]: extract(tar) / p"lua-5.4.8/src"
        - generic [ref=f2e82]: "}"
        - generic [ref=f2e84]: "/// One translation unit -> one object file, wherever `cc` lives."
        - generic [ref=f2e85]: "/// `-I {src}` mounts the whole tree for header probes; `{src / unit}` cuts"
        - generic [ref=f2e86]: /// the single unit out of it. (The oracle caught the original sketch
        - generic [ref=f2e87]: /// compiling a unit WITHOUT its headers — a file cut from its tree loses
        - generic [ref=f2e88]: /// its neighbors.)
        - generic [ref=f2e89]: "fn object(cc: Cc, src: Tree, unit: Path, defines: [Flag]) -> Tree {"
        - generic [ref=f2e90]: "cc! {"
        - generic [ref=f2e91]: "-O2 -Wall {defines}"
        - generic [ref=f2e92]: "-I {src}"
        - generic [ref=f2e93]: "-c {src / unit}"
        - generic [ref=f2e94]: "-o {unit.with_ext(\"o\")}"
        - generic [ref=f2e95]: "}"
        - generic [ref=f2e96]: "}"
        - generic [ref=f2e98]: /// The interpreter, one target at a time.
        - generic [ref=f2e99]: "pub fn lua(target: Target) -> Tree {"
        - generic [ref=f2e100]: let cc = Cc::acquire(target);
        - generic [ref=f2e101]: let ar = Ar::acquire(target);
        - generic [ref=f2e102]: let src = sources();
        - generic [ref=f2e104]: "let defines = match target.os {"
        - generic [ref=f2e105]: Linux => [-DLUA_USE_LINUX],
        - generic [ref=f2e106]: Macos => [-DLUA_USE_MACOSX],
        - generic [ref=f2e107]: _ => [],
        - generic [ref=f2e108]: "};"
        - generic [ref=f2e110]: let units = src.glob("*.c")
        - generic [ref=f2e111]: .filter(|u| u != p"lua.c" && u != p"luac.c" && u != p"onelua.c");
        - generic [ref=f2e113]: "let objs: Tree = units.map(|u| object(cc, src, u, defines)).collect();"
        - generic [ref=f2e115]: // The TREE splices (anchoring mount); bare relative paths would dangle.
        - generic [ref=f2e116]: "let lib = ar! { rcs liblua.a {objs} };"
        - generic [ref=f2e117]: let main = object(cc, src, p"lua.c", defines);
        - generic [ref=f2e118]: "cc! { -o lua {main / p\"lua.o\"} {lib / p\"liblua.a\"} -lm }"
        - generic [ref=f2e119]: "}"
