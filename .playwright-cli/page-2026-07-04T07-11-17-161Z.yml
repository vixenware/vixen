      - textbox [ref=e68]:
        - generic [ref=e69]: // lua.vix — Lua 5.4 for any target the fleet can serve.
        - generic [ref=e71]: "use vix::{Tree, Path, Target};"
        - generic [ref=e72]: "use caps::{Cc, Ar};"
        - generic [ref=e74]: "/// Lua's sources, pinned by content. `fetch` is pure: the checksum IS the identity;"
        - generic [ref=e75]: /// the URL is only a hint about where satisfying bytes may be found.
        - generic [ref=e76]: "fn sources() -> Tree {"
        - generic [ref=e77]: let tar = fetch(
        - generic [ref=e78]: "url: \"https://www.lua.org/ftp/lua-5.4.8.tar.gz\","
        - generic [ref=e79]: "sha256: \"4f18ddae154e9f5d79f21e9a6ba48e5b5f5b2e6ab5e2c4a1e0d3b7f1b7de00d1\","
        - generic [ref=e80]: );
        - generic [ref=e81]: extract(tar) / p"lua-5.4.8/src"
        - generic [ref=e82]: "}"
        - generic [ref=e84]: "/// One translation unit -> one object file, wherever `cc` lives."
        - generic [ref=e85]: "/// `-I {src}` mounts the whole tree for header probes; `{src / unit}` cuts"
        - generic [ref=e86]: /// the single unit out of it. (The oracle caught the original sketch
        - generic [ref=e87]: /// compiling a unit WITHOUT its headers — a file cut from its tree loses
        - generic [ref=e88]: /// its neighbors.)
        - generic [ref=e89]: "fn object(cc: Cc, src: Tree, unit: Path, defines: [Flag]) -> Tree {"
        - generic [ref=e90]: "cc! {"
        - generic [ref=e91]: "-O2 -Wall {defines}"
        - generic [ref=e92]: "-I {src}"
        - generic [ref=e93]: "-c {src / unit}"
        - generic [ref=e94]: "-o {unit.with_ext(\"o\")}"
        - generic [ref=e95]: "}"
        - generic [ref=e96]: "}"
        - generic [ref=e98]: /// The interpreter, one target at a time.
        - generic [ref=e99]: "pub fn lua(target: Target) -> Tree {"
        - generic [ref=e100]: let cc = Cc::acquire(target);
        - generic [ref=e101]: let ar = Ar::acquire(target);
        - generic [ref=e102]: let src = sources();
        - generic [ref=e104]: "let defines = match target.os {"
        - generic [ref=e105]: Linux => [-DLUA_USE_LINUX],
        - generic [ref=e106]: Macos => [-DLUA_USE_MACOSX],
        - generic [ref=e107]: _ => [],
        - generic [ref=e108]: "};"
        - generic [ref=e110]: let units = src.glob("*.c")
        - generic [ref=e111]: .filter(|u| u != p"lua.c" && u != p"luac.c" && u != p"onelua.c");
        - generic [ref=e113]: "let objs: Tree = units.map(|u| object(cc, src, u, defines)).collect();"
        - generic [ref=e115]: // The TREE splices (anchoring mount); bare relative paths would dangle.
        - generic [ref=e116]: "let lib = ar! { rcs liblua.a {objs} };"
        - generic [ref=e117]: let main = object(cc, src, p"lua.c", defines);
        - generic [ref=e118]: "cc! { -o lua {main / p\"lua.o\"} {lib / p\"liblua.a\"} -lm }"
        - generic [ref=e119]: "}"
