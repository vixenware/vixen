[workspace]
members = ["crates/*", "xtask"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/bearcove/vx"

[workspace.dependencies]
# instrumentation
moire = { version = "1.0.0" }


# internal crates
vx-cache = { path = "crates/vx-cache" }
vixenfs-proto = { path = "crates/vixenfs-proto" }
vx-store-proto = { path = "crates/vx-store-proto" }
vx-runner-proto = { path = "crates/vx-runner-proto" }
vx-manifest = { path = "crates/vx-manifest" }
vxd-proto = { path = "crates/vxd-proto" }
vx-report = { path = "crates/vx-report" }
margin = { path = "crates/margin" }
margin-term = { path = "crates/margin-term" }
vx-plan = { path = "crates/vx-plan" }
vx-io = { path = "crates/vx-io" }
vx-tarball = { path = "crates/vx-tarball" }
vx-http = { path = "crates/vx-http" }
vx-tracing = { path = "crates/vx-tracing" }
vx-rs = { path = "crates/vx-rs" }
vx-vfs = { path = "crates/vx-vfs" }
vx-vfsd = { path = "crates/vx-vfsd" }
vx-bootstrap = { path = "crates/vx-bootstrap" }
vx-vfs-types = { path = "crates/vx-vfs-types" }
vx-parser = { path = "crates/vx-parser" }
vx-resolve = { path = "crates/vx-resolve" }
vx-types = { path = "crates/vx-types" }
vx-platform-exec = { path = "crates/vx-platform-exec" }
perfetto-proto = { path = "crates/perfetto-proto" }

# facet ecosystem
facet = { version = "0.44.1", features = ["jiff02", "camino"] }
facet-error = { version = "0.44.1" }
facet-json = { version = "0.44.1" }
facet-toml = { version = "0.44.1" }
facet-postcard = { version = "0.44.1", features = ["jiff02", "camino"] }
facet-cargo-toml = { version = "0.44.0" }
facet-value = { version = "0.44.1" }

# cmdline parsing
figue = { version = "2.0.0" }

# incremental computation
im = "15.1.0"

# RPC
roam = "7.1.0"
roam-core = "7.1.0"
roam-types = "7.1.0"
roam-stream = "7.1.0"
roam-shm = "7.1.0"
shm-primitives = "7.1.0"
roam-local = "7.1.0"
roam-codegen = "7.1.0"
ur-taking-me-with-you = { version = "7.1.0", features = ["tokio"] }

# config files
facet-styx = { version = "3.0.0" }

# process management

# hashing
blake3 = "1"
hex = "0.4"

# content-defined chunking (pin version for CDC boundary stability)
fastcdc = "3"

# error handling
eyre = "0.6"
thiserror = "2"

ulid = "1.2"

# async
tokio = { version = "1", features = [
  "rt-multi-thread",
  "io-util",
  "io-std",
  "macros",
  "net",
  "time",
  "fs",
  "process",
  "sync",
  "signal",
] }
tokio-test-lite = "0.2"
futures-util = "0.3"
async-stream = "0.3"
bytes = "1"

# FUSE (Linux) — vendored
fuse3 = { path = "crates/fuse3", features = ["telemetry"] }

# ProjFS (Windows)
windows-projfs = { version = "0.1", features = ["dynamic-import"] }

# terminal
owo-colors = { version = "4", features = ["supports-color"] }
strip-ansi-escapes = "0.2"
unicode-width = "0.2"
indicatif = "0.18"
arborium = { version = "2.16.0", default-features = false }
arborium-highlight = "2.16.0"
arborium-theme = "2.16.0"
tar = "0.4"
tokio-util = { version = "0.7" }
pin-project-lite = "0.2"

# time
jiff = "0.2"

# paths
camino = "1"
strid = "9.0.0"

# system
libc = "0.2"
cfg-if = "1"
dirs = "6"

# randomness
fastrand = "2"

# temp files
tempfile = "3"

# logging
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = [
  "env-filter",
  "fmt",
  "ansi",
] }

prost = "0.14.3"

# Compile dependencies with optimizations even in dev builds.
# This dramatically speeds up CPU-intensive operations like decompression (xz2/lzma)
# and hashing (sha2, blake3) which dominate toolchain acquisition time.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
debug = 1
split-debuginfo = "unpacked"
strip = "none"

