[workspace]
members = [
  ## crates+
  "crates-plus/*",

  ## lang crates
  "crates/vx-parser",
  "crates/vx-package",
  "crates/vx-types",
  "crates/vx-diagnostics",
  "crates/vx-ir",
  "crates/vx-stdlib",
  "crates/vx-lsp",

  ## eval crates
  "crates/vx-runtime",

  ## runtime support
  "crates/vx-http",
  "crates/vx-tarball",
  "crates/landlock-exec",

  ## core crates
  "crates/vx",
  "crates/vx-daemon",
  "crates/vx-io",
  "crates/vx-services",
  ## services
  "crates/vx-store",
  "crates/vx-runner",
  "crates/vx-vfsd",
  "crates/vx-vfs-types",
  "crates/vx-vfs",
  "crates/vx-fskit",
  "crates/vx-fskit-types",
  ## privileged macOS management daemon (block-device mount + fskitd kill-switch)
  "crates/vx-management",

  "xtask",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/bearcove/vx"

[workspace.dependencies]
# instrumentation
moire = "1.0.1"
vx-services = { path = "crates/vx-services" }
vx-diagnostics = { path = "crates/vx-diagnostics" }
margin = { path = "crates-plus/margin" }
margin-term = { path = "crates-plus/margin-term" }
vx-io = { path = "crates/vx-io" }
vx-vfs = { path = "crates/vx-vfs" }
vx-vfsd = { path = "crates/vx-vfsd" }
vx-vfs-types = { path = "crates/vx-vfs-types" }
vx-parser = { path = "crates/vx-parser" }
vx-package = { path = "crates/vx-package" }
vx-ir = { path = "crates/vx-ir" }
vx-stdlib = { path = "crates/vx-stdlib" }
vx-types = { path = "crates/vx-types" }
vxd = { path = "crates/vx-daemon", package = "vx-daemon" }

# facet ecosystem
facet = { version = "0.46", features = ["jiff02", "camino"] }
facet-error = { version = "0.46" }
facet-json = { version = "0.46" }
facet-postcard = { version = "0.46", features = ["jiff02", "camino"] }
facet-styx = "3.0.0"


# cmdline parsing
figue = { version = "2.0.1" }

# vox RPC framework
vox = { version = "0.8.2", features = ["transport-tcp", "transport-local"] }
vox-types = { version = "0.8.2" }

# copy-and-patch JIT substrate (from ~/phon): executable memory + AArch64
# relocation patching + build-time stencil extraction. Backend-agnostic — no IR.
# Path dep for now; Vixen will reach phon through Vox eventually.
copypatch = { path = "../../phon/rust/copypatch" }

# stackful coroutines (the strand substrate): each strand is a real stack we can
# dump, step through, and off-CPU-profile — which async futures (a shredded state
# machine, no persistent stack while parked) cannot give us. See vx-runtime/strand.
corosensei = "0.3.4"

# process management

# hashing
blake3 = "1"

# content-defined chunking (pin version for CDC boundary stability)
fastcdc = "3"

# error handling
eyre = "0.6"
thiserror = "2"

# async
tokio = { version = "1", features = [
  "rt-multi-thread",
  "io-util",
  "io-std",
  "macros",
  "net",
  "time",
  "fs",
  "process",
  "sync",
  "signal",
] }
futures-util = "0.3"
async-stream = "0.3"
bytes = "1"

# FUSE (Linux) — vendored
fuse3 = { path = "crates-plus/fuse3", features = ["telemetry"] }

# ProjFS (Windows)
windows-projfs = { version = "0.1", features = ["dynamic-import"] }

# terminal
owo-colors = { version = "4", features = ["supports-color"] }
unicode-width = "0.2"
arborium = { version = "2.16.0", default-features = false }
arborium-highlight = "2.16.0"
arborium-theme = "2.16.0"
terminal-light = "1.8"

# paths
camino = "1"

# system
libc = "0.2"
cfg-if = "1"
dirs = "6"

# randomness
fastrand = "2"

# temp files
tempfile = "3"

# logging
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = [
  "env-filter",
  "fmt",
  "ansi",
] }

# Compile dependencies with optimizations even in dev builds.
# This dramatically speeds up CPU-intensive operations like decompression (xz2/lzma)
# and hashing (sha2, blake3) which dominate toolchain acquisition time.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
debug = 1
split-debuginfo = "unpacked"
strip = "none"

[patch.crates-io]

# facet = { git = "https://github.com/facet-rs/facet", branch = "main" }
# facet-core = { git = "https://github.com/facet-rs/facet", branch = "main" }
# facet-macros = { git = "https://github.com/facet-rs/facet", branch = "main" }
# facet-macros-impl = { git = "https://github.com/facet-rs/facet", branch = "main" }
# facet-macro-parse = { git = "https://github.com/facet-rs/facet", branch = "main" }
# facet-macro-types = { git = "https://github.com/facet-rs/facet", branch = "main" }
# facet-reflect = { git = "https://github.com/facet-rs/facet", branch = "main" }
# facet-json = { git = "https://github.com/facet-rs/facet", branch = "main" }
# facet-toml = { git = "https://github.com/facet-rs/facet", branch = "main" }
# facet-postcard = { git = "https://github.com/facet-rs/facet", branch = "main" }
# facet-value = { git = "https://github.com/facet-rs/facet", branch = "main" }
# facet-format = { git = "https://github.com/facet-rs/facet", branch = "main" }
# facet-path = { git = "https://github.com/facet-rs/facet", branch = "main" }

windows-projfs = { path = "vendor/windows-projfs" }

[profile.samply]
inherits = "release"
debug = true

[workspace.lints.clippy]
disallowed-types = "deny"

[workspace.metadata.cargo-shear]
ignored = ["facet-error"]
