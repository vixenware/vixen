[workspace]
members = [
  ## crates+
  "crates-plus/*",

  ## lang crates
  "crates/vx-span",
  "crates/vx-parser",
  "crates/vx-package",
  "crates/vx-types",
  "crates/vx-diagnostics",
  "crates/vx-ir",
  "crates/vx-stdlib",
  "crates/vx-lsp",

  ## eval crates
  "crates/vx-runtime-graph",
  "crates/vx-runtime-core",
  "crates/vx-runtime-driver",
  "crates/vx-exec-protocol",
  "crates/vx-runtime",

  ## runtime support
  "crates/vx-cache-index",
  "crates/vx-http",
  "crates/vx-tarball",
  "crates/landlock-exec",

  ## core crates
  "crates/vx",
  "crates/vx-daemon",
  "crates/vx-io",
  "crates/vx-services",
  ## services
  "crates/vx-store",
  "crates/vx-runner",
  "crates/vx-vfsd",
  "crates/vx-vfs-types",
  "crates/vx-vfs",
  "crates/vx-fskit",
  "crates/vx-fskit-types",
  ## privileged macOS management daemon (block-device mount + fskitd kill-switch)
  "crates/vx-management",

  "xtask",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/bearcove/vx"

[workspace.dependencies]
# instrumentation
moire = "1.0.1"
vx-services = { path = "crates/vx-services" }
vx-exec-protocol = { path = "crates/vx-exec-protocol" }
vx-diagnostics = { path = "crates/vx-diagnostics" }
margin = { path = "crates-plus/margin" }
margin-term = { path = "crates-plus/margin-term" }
vx-io = { path = "crates/vx-io" }
vx-vfs = { path = "crates/vx-vfs" }
vx-vfsd = { path = "crates/vx-vfsd" }
vx-vfs-types = { path = "crates/vx-vfs-types" }
vx-fskit-types = { path = "crates/vx-fskit-types" }
vx-span = { path = "crates/vx-span" }
vx-parser = { path = "crates/vx-parser" }
vx-package = { path = "crates/vx-package" }
vx-ir = { path = "crates/vx-ir" }
vx-stdlib = { path = "crates/vx-stdlib" }
vx-types = { path = "crates/vx-types" }
vxd = { path = "crates/vx-daemon", package = "vx-daemon" }

# facet ecosystem
facet = { version = "0.46", features = ["jiff02", "camino"] }
facet-error = { version = "0.46" }
facet-json = { version = "0.46" }
facet-postcard = { version = "0.46", features = ["jiff02", "camino"] }
facet-styx = "4.0"


# cmdline parsing
figue = { version = "4" }

# vox RPC framework
# Migrated to the local ~/vox checkout (path deps) so the Rust extension and the Swift
# VoxRuntime speak the exact same vox wire. crates.io is still 0.8.2; the only newer code
# is ~/vox. Local-only until vox is published again.
vox = { path = "/Users/amos/vox/rust/vox", features = ["transport-tcp", "transport-local"] }
vox-types = { path = "/Users/amos/vox/rust/vox-types" }
vox-codegen = { path = "/Users/amos/vox/rust/vox-codegen" }

# copy-and-patch JIT substrate (from ~/phon): executable memory + AArch64
# relocation patching + build-time stencil extraction. Backend-agnostic — no IR.
# Path dep for now; Vixen will reach phon through Vox eventually.
copypatch = { path = "../../phon/rust/copypatch" }

# stackful coroutines (the strand substrate): each strand is a real stack we can
# dump, step through, and off-CPU-profile — which async futures (a shredded state
# machine, no persistent stack while parked) cannot give us. See vx-runtime/strand.
corosensei = "0.3.4"

# process management

# hashing
blake3 = "1"

# content-defined chunking (pin version for CDC boundary stability)
fastcdc = "3"

# error handling
eyre = "0.6"
thiserror = "2"

# async
tokio = { version = "1", features = [
  "rt-multi-thread",
  "io-util",
  "io-std",
  "macros",
  "net",
  "time",
  "fs",
  "process",
  "sync",
  "signal",
] }
futures-util = "0.3"
async-stream = "0.3"
bytes = "1"

# FUSE (Linux) — vendored
fuse3 = { path = "crates-plus/fuse3", features = ["telemetry"] }

# ProjFS (Windows)
windows-projfs = { version = "0.1", features = ["dynamic-import"] }

# terminal
owo-colors = { version = "4", features = ["supports-color"] }
unicode-width = "0.2"
arborium = { version = "2.16.0", default-features = false }
arborium-highlight = "2.16.0"
arborium-theme = "2.16.0"
terminal-light = "1.8"

# paths
camino = "1"

# system
libc = "0.2"
cfg-if = "1"
dirs = "6"

# randomness
fastrand = "2"

# temp files
tempfile = "3"

# logging
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = [
  "env-filter",
  "fmt",
  "ansi",
] }

# Compile dependencies with optimizations even in dev builds.
# This dramatically speeds up CPU-intensive operations like decompression (xz2/lzma)
# and hashing (sha2, blake3) which dominate toolchain acquisition time.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
debug = 1
split-debuginfo = "unpacked"
strip = "none"

[patch.crates-io]

# Migrated to the local ~/vox checkout (path deps above) so the Rust extension and the
# Swift VoxRuntime speak the exact same vox wire. ~/vox builds against the local facet
# (~/facet 0.46.5, ahead of crates.io 0.46.0 — it has reflection APIs vox's facet-cbor
# needs) + the format crates in ~/facet-format + figue 4.x, so the whole workspace must
# too. This mirrors ~/vox's own [patch] set. Local-only until those are published again.
#
# ~/facet — core reflection crates (0.46.5).
facet = { path = "/Users/amos/facet/facet" }
facet-core = { path = "/Users/amos/facet/facet-core" }
facet-macros = { path = "/Users/amos/facet/facet-macros" }
facet-macros-impl = { path = "/Users/amos/facet/facet-macros-impl" }
facet-macro-parse = { path = "/Users/amos/facet/facet-macro-parse" }
facet-macro-types = { path = "/Users/amos/facet/facet-macro-types" }
facet-reflect = { path = "/Users/amos/facet/facet-reflect" }
facet-solver = { path = "/Users/amos/facet/facet-solver" }
facet-path = { path = "/Users/amos/facet/facet-path" }
facet-error = { path = "/Users/amos/facet/facet-error" }
facet-default = { path = "/Users/amos/facet/facet-default" }
facet-pretty = { path = "/Users/amos/facet/facet-pretty" }
facet-testhelpers = { path = "/Users/amos/facet/facet-testhelpers" }
facet-testhelpers-macros = { path = "/Users/amos/facet/facet-testhelpers-macros" }
facet-validate = { path = "/Users/amos/facet/facet-validate" }
facet-urlencoded = { path = "/Users/amos/facet/facet-urlencoded" }
facet-testattrs = { path = "/Users/amos/facet/facet-testattrs" }
# ~/facet-format — every format crate, so any transitively-pulled one builds against the
# same ~/facet-format event types rather than a crates.io copy.
facet-value = { path = "/Users/amos/facet-format/facet-value" }
facet-format = { path = "/Users/amos/facet-format/facet-format" }
facet-dessert = { path = "/Users/amos/facet-format/facet-dessert" }
facet-json = { path = "/Users/amos/facet-format/facet-json" }
facet-json-classics = { path = "/Users/amos/facet-format/facet-json-classics" }
facet-postcard = { path = "/Users/amos/facet-format/facet-postcard" }
facet-msgpack = { path = "/Users/amos/facet-format/facet-msgpack" }
facet-toml = { path = "/Users/amos/facet-format/facet-toml" }
facet-yaml = { path = "/Users/amos/facet-format/facet-yaml" }
facet-asn1 = { path = "/Users/amos/facet-format/facet-asn1" }
facet-csv = { path = "/Users/amos/facet-format/facet-csv" }
facet-xdr = { path = "/Users/amos/facet-format/facet-xdr" }
facet-json-schema = { path = "/Users/amos/facet-format/facet-json-schema" }
facet-typescript = { path = "/Users/amos/facet-format/facet-typescript" }
facet-python = { path = "/Users/amos/facet-format/facet-python" }
facet-zod = { path = "/Users/amos/facet-format/facet-zod" }
facet-cargo-toml = { path = "/Users/amos/facet-cargo-toml" }
# figue (used only by crates/vx) — the local 4.x builds against the sealed facet; the
# crates.io 2.0.x predates the seal.
figue = { path = "/Users/amos/figue/crates/figue" }
figue-attrs = { path = "/Users/amos/figue/crates/figue-attrs" }
# facet-styx — crates.io 3.0.0 matches facet enums exhaustively; facet 0.46.5 made some
# #[non_exhaustive], so use the local 4.x which handles it.
facet-styx = { path = "/Users/amos/styx/crates/facet-styx" }

windows-projfs = { path = "vendor/windows-projfs" }

[profile.samply]
inherits = "release"
debug = true

[workspace.lints.clippy]
disallowed-types = "deny"

[workspace.metadata.cargo-shear]
ignored = ["facet-error"]
