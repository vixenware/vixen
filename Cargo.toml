[workspace]
members = ["crates/*", "xtask"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/bearcove/vx"

[workspace.dependencies]
# instrumentation
moire = { git = "https://github.com/bearcove/moire", branch = "main", features = ["diagnostics"] }


# internal crates
vx-cache = { path = "crates/vx-cache" }
vixenfs-proto = { path = "crates/vixenfs-proto" }
vx-store-proto = { path = "crates/vx-store-proto" }
vx-runner-proto = { path = "crates/vx-runner-proto" }
vx-manifest = { path = "crates/vx-manifest" }
vx-project = { path = "crates/vx-project" }
vxd-proto = { path = "crates/vxd-proto" }
vx-report = { path = "crates/vx-report" }
vx-plan = { path = "crates/vx-plan" }
vx-io = { path = "crates/vx-io" }
vx-tarball = { path = "crates/vx-tarball" }
vx-http = { path = "crates/vx-http" }
vx-toolchain = { path = "crates/vx-toolchain" }
vx-tracing = { path = "crates/vx-tracing" }
vx-rs = { path = "crates/vx-rs" }
vx-vfs = { path = "crates/vx-vfs" }
vx-vfsd = { path = "crates/vx-vfsd" }
vx-vfs-types = { path = "crates/vx-vfs-types" }
parking_lot = "0.12"

# facet ecosystem
facet = { git = "https://github.com/facet-rs/facet", branch = "main", features = [
  "jiff02",
  "camino",
] }
facet-error = { git = "https://github.com/facet-rs/facet", branch = "main" }
figue = { git = "https://github.com/bearcove/figue", branch = "main" }
facet-json = { git = "https://github.com/facet-rs/facet", branch = "main" }
facet-styx = { git = "https://github.com/bearcove/styx", branch = "main" }
facet-toml = { git = "https://github.com/facet-rs/facet", branch = "main" }
facet-postcard = { git = "https://github.com/facet-rs/facet", branch = "main", features = [
  "jiff02",
  "camino",
] }
facet-cargo-toml = { git = "https://github.com/bearcove/facet-cargo-toml", branch = "main" }

# incremental computation
picante = { git = "https://github.com/bearcove/picante", branch = "main", features = ["macros"] }

# RPC
roam = { git = "https://github.com/bearcove/roam", branch = "main" }
roam-core = { git = "https://github.com/bearcove/roam", branch = "main" }
roam-types = { git = "https://github.com/bearcove/roam", branch = "main" }
roam-stream = { git = "https://github.com/bearcove/roam", branch = "main" }
roam-shm = { git = "https://github.com/bearcove/roam", branch = "main" }
shm-primitives = { git = "https://github.com/bearcove/roam", branch = "main" }
roam-local = { git = "https://github.com/bearcove/roam", branch = "main" }
roam-codegen = { git = "https://github.com/bearcove/roam", branch = "main" }
ur-taking-me-with-you = { git = "https://github.com/bearcove/roam", branch = "main", features = [
  "tokio",
] }

# process management

# hashing
blake3 = "1"
hex = "0.4"

# content-defined chunking (pin version for CDC boundary stability)
fastcdc = "3"

# error handling
eyre = "0.6"
thiserror = "2"

ulid = "1.2"

# async
tokio = { version = "1", features = [
  "rt-multi-thread",
  "io-util",
  "io-std",
  "macros",
  "net",
  "time",
  "fs",
  "process",
  "sync",
  "signal",
] }
tokio-test-lite = "0.2"
futures-util = "0.3"
async-stream = "0.3"
bytes = "1"

# FUSE (Linux) — vendored
fuse3 = { path = "crates/fuse3", features = ["telemetry"] }

# ProjFS (Windows)
windows-projfs = { version = "0.1", features = ["dynamic-import"] }

# terminal
owo-colors = { version = "4", features = ["supports-color"] }
strip-ansi-escapes = "0.2"
unicode-width = "0.2"
indicatif = "0.18"

# build utilities
petgraph = "0.8"
tar = "0.4"
tokio-util = { version = "0.7" }
pin-project-lite = "0.2"

# time
jiff = "0.2"

# paths
camino = "1"
strid = "8.0.0"

# system
libc = "0.2"
cfg-if = "1"
dirs = "6"

# randomness
fastrand = "2"

# temp files
tempfile = "3"
async-tempfile = "0.7"

# logging
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = [
  "env-filter",
  "fmt",
  "ansi",
] }

# Compile dependencies with optimizations even in dev builds.
# This dramatically speeds up CPU-intensive operations like decompression (xz2/lzma)
# and hashing (sha2, blake3) which dominate toolchain acquisition time.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
debug = 1
split-debuginfo = "unpacked"
strip = "none"

[patch.crates-io]
facet = { git = "https://github.com/facet-rs/facet", branch = "main" }
facet-core = { git = "https://github.com/facet-rs/facet", branch = "main" }
facet-macros = { git = "https://github.com/facet-rs/facet", branch = "main" }
facet-macros-impl = { git = "https://github.com/facet-rs/facet", branch = "main" }
facet-macro-parse = { git = "https://github.com/facet-rs/facet", branch = "main" }
facet-macro-types = { git = "https://github.com/facet-rs/facet", branch = "main" }
facet-reflect = { git = "https://github.com/facet-rs/facet", branch = "main" }
facet-json = { git = "https://github.com/facet-rs/facet", branch = "main" }
facet-toml = { git = "https://github.com/facet-rs/facet", branch = "main" }
facet-postcard = { git = "https://github.com/facet-rs/facet", branch = "main" }
facet-value = { git = "https://github.com/facet-rs/facet", branch = "main" }
facet-format = { git = "https://github.com/facet-rs/facet", branch = "main" }
facet-path = { git = "https://github.com/facet-rs/facet", branch = "main" }

# [patch."https://github.com/bearcove/picante"]
# picante = { path = "../picante/crates/picante" }
# picante-macros = { path = "../picante/crates/picante-macros" }

