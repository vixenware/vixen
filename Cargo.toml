# roam-stream = { path = "/Users/amos/bearcove/roam/rust/roam-stream" }
# roam-shm = { path = "/Users/amos/bearcove/roam/rust/roam-shm" }
# shm-primitives = { path = "/Users/amos/bearcove/roam/rust/shm-primitives" }
# roam-local = { path = "/Users/amos/bearcove/roam/rust/roam-local" }
# roam-codegen = { path = "/Users/amos/bearcove/roam/rust/roam-codegen" }
# ur-taking-me-with-you = { path = "/Users/amos/bearcove/roam/rust/ur-taking-me-with-you" }
windows-projfs = { path = "vendor/windows-projfs" }

[profile.samply]
inherits = "release"
debug = true

[workspace.lints.clippy]
disallowed-types = "deny"

[workspace.metadata.cargo-shear]
ignored = ["facet-error"]
