[workspace]
members = ["crates/*", "xtask"]
exclude = ["crates/tree-sitter-vixen", "crates/windows-projfs"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/bearcove/vx"

[workspace.dependencies]
moire = "1.0.1"
vx-services = { path = "crates/vx-services" }
vx-exec-protocol = { path = "crates/vx-exec-protocol" }
vx-diagnostics = { path = "crates/vx-diagnostics" }
margin = { path = "crates/margin" }
margin-term = { path = "crates/margin-term" }
vx-io = { path = "crates/vx-io" }
vx-vfs = { path = "crates/vx-vfs" }
vx-vfsd = { path = "crates/vx-vfsd" }
vx-vfs-types = { path = "crates/vx-vfs-types" }
vx-fskit-types = { path = "crates/vx-fskit-types" }
vx-span = { path = "crates/vx-span" }
vx-parser = { path = "crates/vx-parser" }
vx-package = { path = "crates/vx-package" }
vx-ir = { path = "crates/vx-ir" }
vx-stdlib = { path = "crates/vx-stdlib" }
vx-types = { path = "crates/vx-types" }
command-model = { path = "crates/command-model" }
command-grammar-vx = { path = "crates/command-grammar-vx" }
vxd = { path = "crates/vx-daemon", package = "vx-daemon" }

# facet ecosystem
facet = { version = "0.50.0-rc.0", features = ["jiff02", "camino"] }
facet-error = { version = "0.50.0-rc.0" }
facet-json = { version = "0.50.0-rc.0" }
facet-postcard = { version = "0.50.0-rc.0", features = ["jiff02", "camino"] }
facet-styx = "5.0.0-rc.0"


# cmdline parsing
figue = { version = "5.0.0-rc.0" }

# vox RPC framework
vox = { version = "0.10.0-rc.1", features = ["transport-tcp", "transport-local"] }
vox-types = "0.10.0-rc.1"
vox-codegen = "0.10.0-rc.2"

# copy-and-patch JIT substrate: executable memory + AArch64
# relocation patching + build-time stencil extraction. Backend-agnostic — no IR.
copypatch = "0.2.0-rc.0"

# stackful coroutines (the strand substrate): each strand is a real stack we can
# dump, step through, and off-CPU-profile — which async futures (a shredded state
# machine, no persistent stack while parked) cannot give us. See vx-runtime/strand.
corosensei = "0.3.4"

# process management

# hashing
blake3 = "1"

# content-defined chunking (pin version for CDC boundary stability)
fastcdc = "3"

# error handling
eyre = "0.6"
thiserror = "2"

# async
tokio = { version = "1", features = [
  "rt-multi-thread",
  "io-util",
  "io-std",
  "macros",
  "net",
  "time",
  "fs",
  "process",
  "sync",
  "signal",
] }
futures-util = "0.3"
async-stream = "0.3"
bytes = "1"

# FUSE (Linux) — vendored
fuse3 = { path = "crates/fuse3", features = ["telemetry"] }

# ProjFS (Windows)
windows-projfs = { version = "0.1", features = ["dynamic-import"] }

# terminal
owo-colors = { version = "4", features = ["supports-color"] }
unicode-width = "0.2"
arborium = { version = "2.16.0", default-features = false }
arborium-highlight = "2.16.0"
arborium-theme = "2.16.0"
terminal-light = "1.8"

# paths
camino = "1"

# system
libc = "0.2"
cfg-if = "1"
dirs = "6"

# randomness
fastrand = "2"

# temp files
tempfile = "3"

# logging
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = [
  "env-filter",
  "fmt",
  "ansi",
] }

# Compile dependencies with optimizations even in dev builds.
# This dramatically speeds up CPU-intensive operations like decompression (xz2/lzma)
# and hashing (sha2, blake3) which dominate toolchain acquisition time.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
debug = 1
split-debuginfo = "unpacked"
strip = "none"

[patch.crates-io]
windows-projfs = { path = "crates/windows-projfs" }

[profile.samply]
inherits = "release"
debug = true

[workspace.lints.clippy]
disallowed-types = "deny"

[workspace.metadata.cargo-shear]
ignored = ["facet-error"]
