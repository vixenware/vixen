[workspace]
members = [
  ## crates+
  "crates-plus/*",

  ## lang crates
  "crates/vx-parser",
  "crates/vx-resolve",
  "crates/vx-stdlib",
  "crates/vx-lsp",

  ## eval crates
  "crates/vx-analysis",
  "crates/vx-jit",
  "crates/vx-diagnostics",

  ## runtime support
  "crates/vx-http",
  "crates/vx-tarball",
  "crates/landlock-exec",

  ## core crates
  "crates/vx-types",
  "crates/vx",
  "crates/vx-daemon",
  "crates/vx-io",
  "crates/vx-services",
  "crates/vx-tracing",

  ## services
  # "crates/vx-vfsd",
  # "crates/vx-store",
  # "crates/vx-runner",
  # "crates/vx-vfs-types",
  # "crates/vx-vfs",
  # "crates/vx-fskit",

  "xtask",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/bearcove/vx"

[workspace.dependencies]
# instrumentation
moire = { version = "1.0.0" }
vx-services = { path = "crates/vx-services" }
vx-report = { path = "crates/vx-report" }
margin = { path = "crates-plus/margin" }
margin-term = { path = "crates-plus/margin-term" }
vx-io = { path = "crates/vx-io" }
vx-http = { path = "crates/vx-http" }
vx-tracing = { path = "crates/vx-tracing" }
vx-vfs = { path = "crates/vx-vfs" }
vx-vfs-types = { path = "crates/vx-vfs-types" }
vx-analysis = { path = "crates/vx-analysis" }
vx-parser = { path = "crates/vx-parser" }
vx-resolve = { path = "crates/vx-resolve" }
vx-types = { path = "crates/vx-types" }
vx-diagnostics = { path = "crates/vx-diagnostics" }
vxd = { path = "crates/vx-daemon" }
vx-jit = { path = "crates/vx-jit" }
kajit = { git = "https://github.com/bearcove/kajit", rev = "5e11f00" }
kajit-hir = { git = "https://github.com/bearcove/kajit", rev = "5e11f00" }

# facet ecosystem
facet = { version = "0.44.1", features = ["jiff02", "camino"] }
facet-error = { version = "0.44.1" }
facet-json = { version = "0.44.1" }
facet-postcard = { version = "0.44.1", features = ["jiff02", "camino"] }
facet-cargo-toml = { version = "0.44.0" }

# cmdline parsing
figue = { version = "2.0.0" }

# vox RPC framework
shm-primitives = "7.1.0"
ur-taking-me-with-you = { version = "7.1.0", features = ["tokio"] }

vox = { version = "0.3.1" }
vox-core = { version = "0.3.1" }
vox-stream = { version = "0.3.1" }
vox-local = { version = "0.3.1" }
vox-shm = { version = "0.3.1" }
vox-codegen = { version = "0.3.1" }

# config files
facet-styx = { version = "3.0.0" }

# process management

# hashing
blake3 = "1"
hex = "0.4"

# content-defined chunking (pin version for CDC boundary stability)
fastcdc = "3"

# error handling
eyre = "0.6"
thiserror = "2"

ulid = "1.2"

# async
tokio = { version = "1", features = [
  "rt-multi-thread",
  "io-util",
  "io-std",
  "macros",
  "net",
  "time",
  "fs",
  "process",
  "sync",
  "signal",
] }
futures-util = "0.3"
async-stream = "0.3"
bytes = "1"

# FUSE (Linux) — vendored
fuse3 = { path = "crates-plus/fuse3", features = ["telemetry"] }

# ProjFS (Windows)
windows-projfs = { version = "0.1", features = ["dynamic-import"] }

# terminal
owo-colors = { version = "4", features = ["supports-color"] }
strip-ansi-escapes = "0.2"
unicode-width = "0.2"
indicatif = "0.18"
arborium = { version = "2.16.0", default-features = false }
arborium-highlight = "2.16.0"
arborium-theme = "2.16.0"
tar = "0.4"
tokio-util = { version = "0.7" }
pin-project-lite = "0.2"

# time
jiff = "0.2"

# paths
camino = "1"
strid = "9.0.0"

# system
libc = "0.2"
cfg-if = "1"
dirs = "6"

# randomness
fastrand = "2"

# temp files
tempfile = "3"

# logging
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = [
  "env-filter",
  "fmt",
  "ansi",
] }

prost = "0.14.3"

# Compile dependencies with optimizations even in dev builds.
# This dramatically speeds up CPU-intensive operations like decompression (xz2/lzma)
# and hashing (sha2, blake3) which dominate toolchain acquisition time.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
debug = 1
split-debuginfo = "unpacked"
strip = "none"

[patch.crates-io]

# facet = { git = "https://github.com/facet-rs/facet", branch = "main" }
# facet-core = { git = "https://github.com/facet-rs/facet", branch = "main" }
# facet-macros = { git = "https://github.com/facet-rs/facet", branch = "main" }
# facet-macros-impl = { git = "https://github.com/facet-rs/facet", branch = "main" }
# facet-macro-parse = { git = "https://github.com/facet-rs/facet", branch = "main" }
# facet-macro-types = { git = "https://github.com/facet-rs/facet", branch = "main" }
# facet-reflect = { git = "https://github.com/facet-rs/facet", branch = "main" }
# facet-json = { git = "https://github.com/facet-rs/facet", branch = "main" }
# facet-toml = { git = "https://github.com/facet-rs/facet", branch = "main" }
# facet-postcard = { git = "https://github.com/facet-rs/facet", branch = "main" }
# facet-value = { git = "https://github.com/facet-rs/facet", branch = "main" }
# facet-format = { git = "https://github.com/facet-rs/facet", branch = "main" }
# facet-path = { git = "https://github.com/facet-rs/facet", branch = "main" }

vox = { path = "../vox/rust/vox" }
vox-core = { path = "../vox/rust/vox-core" }
vox-stream = { path = "../vox/rust/vox-stream" }
vox-local = { path = "../vox/rust/vox-local" }
vox-shm = { path = "../vox/rust/vox-shm" }
vox-codegen = { path = "../vox/rust/vox-codegen" }

windows-projfs = { path = "vendor/windows-projfs" }

[profile.samply]
inherits = "release"
debug = true

[workspace.lints.clippy]
disallowed-types = "deny"

[workspace.metadata.cargo-shear]
ignored = ["facet-error"]
