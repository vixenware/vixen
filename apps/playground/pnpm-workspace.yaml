# Standalone pnpm root. The vox TS runtime comes from the sibling facet
# checkout (open source) via link: deps — plain symlinks, so the packages'
# own workspace node_modules resolve their internal deps (run `pnpm install`
# in <facet>/vox first). Publish rc packages when this gets annoying.
packages:
  - "."
minimumReleaseAgeExclude:
  - "@bearcove/phon-engine@0.2.0-rc.0"
  - "@bearcove/phon-schema@0.2.0-rc.0"
  - "@bearcove/phon@0.2.0-rc.0"
