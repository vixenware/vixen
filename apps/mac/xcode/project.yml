name: Vixen
options:
  bundleIdPrefix: eu.bearcove
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    DEVELOPMENT_TEAM: B2N6FSRTPV
    CODE_SIGN_STYLE: Automatic

packages:
  vox-runtime:
    path: ../../../../vox/swift/vox-runtime
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle.git
    from: 2.8.1

targets:
  Vixen:
    type: application
    platform: macOS
    sources:
      - path: Vixen
        excludes:
          - "*.entitlements"
          - Info.plist
    entitlements:
      path: Vixen/Vixen.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups:
          - B2N6FSRTPV.vixenfs
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - "eu.bearcove.vixen-spks"
          - "eu.bearcove.vixen-spki"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.bearcove.vixen
        INFOPLIST_FILE: Vixen/Info.plist
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 0.0.0
        CURRENT_PROJECT_VERSION: 0.0.0
        SPARKLE_FEED_URL: ""
        SPARKLE_PUBLIC_ED_KEY: ""
    dependencies:
      - target: VixenFS
        embed: true
        codeSign: true
      - package: Sparkle
        product: Sparkle
      - sdk: FSKit.framework

  VixenFS:
    type: extensionkit-extension
    platform: macOS
    preBuildScripts:
      - name: Build Rust FSKit bridge
        script: |
          set -euo pipefail
          repo_root="$(cd "$SRCROOT/../../.." && pwd)"
          out_dir="$SRCROOT/build/RustLibs"
          mkdir -p "$out_dir"
          if [[ "$CONFIGURATION" == "Release" ]]; then
            cargo build --manifest-path "$repo_root/Cargo.toml" --package xpc-poc --lib --release
            cp "$repo_root/target/release/libxpc_poc.a" "$out_dir/libxpc_poc.a"
          else
            cargo build --manifest-path "$repo_root/Cargo.toml" --package xpc-poc --lib
            cp "$repo_root/target/debug/libxpc_poc.a" "$out_dir/libxpc_poc.a"
          fi
    sources:
      - path: VixenFS
        excludes:
          - "*.entitlements"
          - Info.plist
    entitlements:
      path: VixenFS/VixenFS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.developer.fskit.fsmodule: true
        com.apple.security.application-groups:
          - B2N6FSRTPV.vixenfs
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.bearcove.vixenfs
        PRODUCT_NAME: VixenFS
        INFOPLIST_FILE: VixenFS/Info.plist
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 0.0.0
        CURRENT_PROJECT_VERSION: 0.0.0
        CODE_SIGN_ALLOW_ENTITLEMENTS_MODIFICATION: YES
        SWIFT_OBJC_BRIDGING_HEADER: VixenFS/VixenFS-Bridging-Header.h
        LIBRARY_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/build/RustLibs
        OTHER_LDFLAGS:
          - $(inherited)
          - -lxpc_poc
    dependencies:
      - package: vox-runtime
        product: VoxRuntime
