name: Vixen
options:
  bundleIdPrefix: eu.bearcove
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    DEVELOPMENT_TEAM: B2N6FSRTPV
    CODE_SIGN_STYLE: Automatic
  configs:
    Release:
      ARCHS: arm64
      ENABLE_HARDENED_RUNTIME: YES

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle.git
    from: 2.8.1
  vox:
    # Local ~/vox checkout (path dep). The Rust extension links ~/vox's vox crates, so the
    # Swift VoxRuntime must come from the same ~/vox to speak the identical wire — crates.io
    # 0.8.2's unix framing doesn't interop with it. ~/vox is on the phon-codec branch, so
    # VoxRuntime + the generated bindings serialize via phon (PhonSchema/IR/Engine, from
    # ~/phon); use the swift/vox-runtime package that declares those deps, not the phon-free
    # root. Local-only until vox is published again.
    path: /Users/amos/vox/swift/vox-runtime

targets:
  Vixen:
    type: application
    platform: macOS
    sources:
      - path: Vixen
        excludes:
          - "*.entitlements"
          - Info.plist
    postBuildScripts:
      - name: Embed Vixen Management
        inputFiles:
          - "$(SRCROOT)/build/RustLibs/vixen-management"
        outputFiles:
          - "$(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/MacOS/vixen-management"
        script: |
          set -euo pipefail
          helper_src="$SRCROOT/build/RustLibs/vixen-management"
          contents="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH"
          helper_dst="$contents/MacOS/vixen-management"
          if [[ ! -f "$helper_src" ]]; then
            echo "missing staged vixen-management helper at $helper_src" >&2
            exit 1
          fi
          install -d "$contents/MacOS"
          install -m 755 "$helper_src" "$helper_dst"
          if [[ "${CODE_SIGNING_ALLOWED:-NO}" != "NO" ]]; then
            identity="${EXPANDED_CODE_SIGN_IDENTITY:-}"
            helper_identifier="${PRODUCT_BUNDLE_IDENTIFIER:-eu.bearcove.vixen}"
            code_sign_flags=()
            if [[ "${ENABLE_HARDENED_RUNTIME:-NO}" == "YES" ]]; then
              code_sign_flags+=(--options runtime)
            fi
            if [[ -n "${OTHER_CODE_SIGN_FLAGS:-}" ]]; then
              read -r -a extra_code_sign_flags <<< "${OTHER_CODE_SIGN_FLAGS}"
              code_sign_flags+=("${extra_code_sign_flags[@]}")
            else
              code_sign_flags+=(--timestamp=none)
            fi
            if [[ -n "$identity" && "$identity" != "-" ]]; then
              codesign --force --sign "$identity" --identifier "$helper_identifier" "${code_sign_flags[@]}" "$helper_dst"
            else
              codesign --force --sign - --identifier "$helper_identifier" "$helper_dst"
            fi
          fi
    entitlements:
      path: Vixen/Vixen.entitlements
      properties:
        com.apple.security.network.client: true
        com.apple.security.application-groups:
          - B2N6FSRTPV.vixenfs
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - "eu.bearcove.vixen-spks"
          - "eu.bearcove.vixen-spki"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.bearcove.vixen
        INFOPLIST_FILE: Vixen/Info.plist
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 0.0.0
        CURRENT_PROJECT_VERSION: 0.0.0
        SPARKLE_FEED_URL: ""
        SPARKLE_PUBLIC_ED_KEY: ""
    dependencies:
      - target: VixenFS
        embed: true
        codeSign: true
      - package: Sparkle
        product: Sparkle
      - package: vox
        product: VoxRuntime
      - sdk: FSKit.framework
      - sdk: ServiceManagement.framework

  VixenFS:
    type: extensionkit-extension
    platform: macOS
    deploymentTarget: "15.4"
    preBuildScripts: []
    sources:
      - path: VixenFS
        excludes:
          - "*.entitlements"
          - Info.plist
    entitlements:
      path: VixenFS/VixenFS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.developer.fskit.fsmodule: true
        com.apple.security.application-groups:
          - B2N6FSRTPV.vixenfs
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.bearcove.vixenfs
        PRODUCT_NAME: VixenFS
        INFOPLIST_FILE: VixenFS/Info.plist
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 0.0.0
        CURRENT_PROJECT_VERSION: 0.0.0
        CODE_SIGN_ALLOW_ENTITLEMENTS_MODIFICATION: YES
        SWIFT_OBJC_BRIDGING_HEADER: VixenFS/VixenFS-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/build/RustLibs
        LIBRARY_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/build/RustLibs
        OTHER_LDFLAGS:
          - $(inherited)
          - -lvx_fskit
