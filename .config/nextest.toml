# Nextest configuration for vx integration tests

# Enable experimental setup scripts feature
experimental = ["setup-scripts"]

[scripts.setup.start-vxd-for-tests-unix]
command = 'bash tests/start-vxd-for-tests.sh'

[scripts.setup.start-vxd-for-tests-windows]
command = ['powershell', '-ExecutionPolicy', 'Bypass', '-File', 'tests/warmup-toolchains.ps1']

# Run setup scripts for all tests (platform-specific)
[[profile.default.scripts]]
platform = { host = "cfg(unix)" }
filter = 'all()'
setup = ['start-vxd-for-tests-unix']

[[profile.default.scripts]]
platform = { host = "cfg(windows)" }
filter = 'all()'
setup = ['start-vxd-for-tests-windows']
