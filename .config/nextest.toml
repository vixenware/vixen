# Nextest configuration for vx integration tests

# Enable experimental setup scripts feature
experimental = ["setup-scripts"]

# Warmup script: prime a shared CAS with toolchains so per-test
# materializations can read from it via LayeredStorage (VX_CAS_BASE).
# Runs after build-daemons (needs the built binaries).
[scripts.setup.warmup-toolchains]
command = 'bash tests/warmup-toolchains.sh'

# Run setup scripts for all tests (order matters: build first, then warmup)
[[profile.default.scripts]]
filter = 'all()'
setup = ['warmup-toolchains']
