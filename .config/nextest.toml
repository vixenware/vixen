# Nextest configuration

experimental = ["wrapper-scripts"]

[scripts.wrapper.systemd-memory]
command = { command-line = "scripts/nextest-systemd-run.sh", relative-to = "workspace-root" }

[profile.default]
slow-timeout = { period = "5s", terminate-after = 6 }

[profile.patient]
slow-timeout = { period = "30s", terminate-after = 4 }

[profile.systemd]
slow-timeout = { period = "5s", terminate-after = 6 }

[[profile.systemd.scripts]]
platform = { host = 'cfg(target_os = "linux")' }
run-wrapper = "systemd-memory"

[test-groups]
macos-vfs = { max-threads = 1 }

[[profile.default.overrides]]
filter = '(package(vx-daemon) and (test(local_all_in_one_daemon_boots_without_loopback_rpc) or test(local_all_in_one_orchestrator_can_return_tree_backed_by_store) or test(orchestrator_can_exec_rustc_through_hosted_vfsd))) or (package(vx) and test(eval_auto_starts_daemon_and_runs_rustc_hello))'
test-group = 'macos-vfs'
